<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#555"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="260" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#1a1a1a">AgentProvider Decorator Stack</text>

  <!-- Caller box -->
  <rect x="180" y="40" width="160" height="36" rx="4" fill="#f0f4f8" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="260" y="63" text-anchor="middle" font-weight="500" fill="#334155">@AgentService Proxy</text>

  <!-- Arrow down -->
  <line x1="260" y1="76" x2="260" y2="100" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Input Guardrail -->
  <rect x="80" y="104" width="360" height="60" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="260" y="126" text-anchor="middle" font-weight="600" fill="#92400e">InputGuardrailDecorator</text>
  <text x="260" y="144" text-anchor="middle" font-size="11" fill="#92400e">@Priority(1400) — validates prompt before invocation</text>
  <text x="444" y="126" text-anchor="end" font-size="11" font-weight="600" fill="#b45309">FAIL →</text>

  <!-- Arrow down -->
  <line x1="260" y1="164" x2="260" y2="188" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Output Guardrail -->
  <rect x="80" y="192" width="360" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="260" y="214" text-anchor="middle" font-weight="600" fill="#1e40af">OutputGuardrailDecorator</text>
  <text x="260" y="232" text-anchor="middle" font-size="11" fill="#1e40af">@Priority(1600) — buffer, validate, replay or reprompt</text>
  <text x="444" y="214" text-anchor="end" font-size="11" font-weight="600" fill="#2563eb">FAIL →</text>

  <!-- Arrow down -->
  <line x1="260" y1="252" x2="260" y2="276" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Gate -->
  <rect x="80" y="280" width="360" height="60" rx="6" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="260" y="302" text-anchor="middle" font-weight="600" fill="#5b21b6">GatedAgentProvider</text>
  <text x="260" y="320" text-anchor="middle" font-size="11" fill="#5b21b6">@Priority(2000) — rate limit + concurrency gate</text>

  <!-- Arrow down -->
  <line x1="260" y1="340" x2="260" y2="364" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Backend -->
  <rect x="140" y="368" width="240" height="36" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="260" y="391" text-anchor="middle" font-weight="500" fill="#065f46">RoutingAgentProvider → Backend</text>

  <!-- Fail arrows to right -->
  <line x1="440" y1="134" x2="490" y2="134" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="500" y="138" font-size="11" fill="#92400e">GuardrailException</text>

  <line x1="440" y1="222" x2="490" y2="222" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="500" y="226" font-size="11" fill="#1e40af">GuardrailException</text>
</svg>
