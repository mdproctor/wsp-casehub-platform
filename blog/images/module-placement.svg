<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="system-ui, -apple-system, sans-serif" font-size="12">
  <rect width="640" height="320" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- template-registry-api -->
  <rect x="30" y="20" width="260" height="280" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="160" y="42" text-anchor="middle" fill="#1e40af" font-weight="700" font-size="13">template-registry-api</text>
  <text x="160" y="58" text-anchor="middle" fill="#3b82f6" font-size="10">zero dependencies</text>

  <rect x="45" y="70" width="230" height="22" rx="3" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="160" y="85" text-anchor="middle" fill="#1e40af" font-size="11">VariationSeeder (SPI)</text>

  <rect x="45" y="98" width="230" height="22" rx="3" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="160" y="113" text-anchor="middle" fill="#1e40af" font-size="11">AdaptiveFallbackMatcher (SPI)</text>

  <rect x="45" y="126" width="230" height="22" rx="3" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="160" y="141" text-anchor="middle" fill="#1e40af" font-size="11">ClassificationResult (sealed)</text>

  <rect x="45" y="154" width="230" height="22" rx="3" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="160" y="169" text-anchor="middle" fill="#1e40af" font-size="11">CollisionDetector (utility)</text>

  <rect x="45" y="182" width="230" height="22" rx="3" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="160" y="197" text-anchor="middle" fill="#1e40af" font-size="11">replaceOrRegister (SPI)</text>

  <rect x="45" y="210" width="230" height="22" rx="3" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="160" y="225" text-anchor="middle" fill="#1e40af" font-size="11">matchStructural (SPI)</text>

  <rect x="45" y="238" width="230" height="22" rx="3" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="160" y="253" text-anchor="middle" fill="#1e40af" font-size="11">TemplateNamespace + language</text>

  <rect x="45" y="266" width="230" height="22" rx="3" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="160" y="281" text-anchor="middle" fill="#1e40af" font-size="11">TemplateCandidate</text>

  <!-- template-registry-llm -->
  <rect x="320" y="20" width="290" height="280" rx="6" fill="#fce7f3" stroke="#f9a8d4" stroke-width="1.5"/>
  <text x="465" y="42" text-anchor="middle" fill="#9d174d" font-weight="700" font-size="13">template-registry-llm</text>
  <text x="465" y="58" text-anchor="middle" fill="#ec4899" font-size="10">depends on template-registry + langchain4j</text>

  <rect x="335" y="70" width="260" height="22" rx="3" fill="#fdf2f8" stroke="#fbcfe8"/>
  <text x="465" y="85" text-anchor="middle" fill="#9d174d" font-size="11">AdaptiveTemplateRegistry</text>

  <rect x="335" y="98" width="260" height="22" rx="3" fill="#fdf2f8" stroke="#fbcfe8"/>
  <text x="465" y="113" text-anchor="middle" fill="#9d174d" font-size="11">ClassificationCache</text>

  <rect x="335" y="126" width="260" height="22" rx="3" fill="#fdf2f8" stroke="#fbcfe8"/>
  <text x="465" y="141" text-anchor="middle" fill="#9d174d" font-size="11">LlmVariationSeeder</text>

  <rect x="335" y="154" width="260" height="22" rx="3" fill="#fdf2f8" stroke="#fbcfe8"/>
  <text x="465" y="169" text-anchor="middle" fill="#9d174d" font-size="11">LlmAdaptiveFallback</text>

  <rect x="335" y="182" width="260" height="22" rx="3" fill="#fdf2f8" stroke="#fbcfe8"/>
  <text x="465" y="197" text-anchor="middle" fill="#9d174d" font-size="11">VariationSeedingService</text>

  <!-- Dependency arrow -->
  <text x="465" y="240" text-anchor="middle" fill="#94a3b8" font-size="10" font-style="italic">template-registry stays pure NLP</text>
  <text x="465" y="256" text-anchor="middle" fill="#94a3b8" font-size="10" font-style="italic">LLM concern isolated in its own module</text>
</svg>
