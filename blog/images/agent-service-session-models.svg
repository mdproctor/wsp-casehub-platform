<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#374151" stroke-width="1.2"/>
    </marker>
  </defs>

  <text x="360" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">Session Models: LangChain4j vs CaseHub</text>

  <!-- LangChain4j side -->
  <rect x="20" y="44" width="320" height="260" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="1"/>
  <text x="180" y="68" text-anchor="middle" font-weight="600" fill="#991B1B" font-size="14">LangChain4j — Stateless Replay</text>

  <rect x="40" y="84" width="120" height="36" rx="4" fill="white" stroke="#6B7280"/>
  <text x="100" y="106" text-anchor="middle" fill="#374151" font-size="12">ChatMemory</text>

  <rect x="40" y="140" width="120" height="36" rx="4" fill="white" stroke="#6B7280"/>
  <text x="100" y="162" text-anchor="middle" fill="#374151" font-size="12">Full replay</text>

  <rect x="200" y="84" width="120" height="36" rx="4" fill="white" stroke="#6B7280"/>
  <text x="260" y="106" text-anchor="middle" fill="#374151" font-size="12">LLM API</text>

  <line x1="160" y1="102" x2="195" y2="102" stroke="#374151" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="100" y1="120" x2="100" y2="136" stroke="#374151" stroke-width="1.2" marker-end="url(#arr)"/>

  <text x="180" y="200" text-anchor="middle" fill="#991B1B" font-size="11">Every call sends full history</text>
  <text x="180" y="218" text-anchor="middle" fill="#991B1B" font-size="11">Cache flags reduce prefix cost</text>
  <text x="180" y="236" text-anchor="middle" fill="#991B1B" font-size="11">but replay still happens</text>

  <!-- CaseHub side -->
  <rect x="380" y="44" width="320" height="260" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1"/>
  <text x="540" y="68" text-anchor="middle" font-weight="600" fill="#065F46" font-size="14">CaseHub — Real Sessions</text>

  <!-- Claude CLI path -->
  <rect x="400" y="84" width="130" height="36" rx="4" fill="white" stroke="#059669"/>
  <text x="465" y="100" text-anchor="middle" fill="#065F46" font-size="11">Claude CLI</text>
  <text x="465" y="114" text-anchor="middle" fill="#065F46" font-size="11">subprocess</text>

  <rect x="560" y="84" width="120" height="36" rx="4" fill="white" stroke="#059669"/>
  <text x="620" y="100" text-anchor="middle" fill="#065F46" font-size="11">Server-side</text>
  <text x="620" y="114" text-anchor="middle" fill="#065F46" font-size="11">context</text>

  <line x1="530" y1="102" x2="555" y2="102" stroke="#059669" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- HTTP path -->
  <rect x="400" y="140" width="130" height="36" rx="4" fill="white" stroke="#2563EB"/>
  <text x="465" y="156" text-anchor="middle" fill="#1E40AF" font-size="11">Anthropic HTTP</text>
  <text x="465" y="170" text-anchor="middle" fill="#1E40AF" font-size="11">+ SDK caching</text>

  <rect x="560" y="140" width="120" height="36" rx="4" fill="white" stroke="#2563EB"/>
  <text x="620" y="156" text-anchor="middle" fill="#1E40AF" font-size="11">Cached prefix</text>
  <text x="620" y="170" text-anchor="middle" fill="#1E40AF" font-size="11">+ new turn</text>

  <line x1="530" y1="158" x2="555" y2="158" stroke="#2563EB" stroke-width="1.2" marker-end="url(#arr)"/>

  <text x="540" y="210" text-anchor="middle" fill="#065F46" font-size="11">CLI: no replay at all</text>
  <text x="540" y="228" text-anchor="middle" fill="#065F46" font-size="11">HTTP: replay with SDK-level caching</text>
  <text x="540" y="246" text-anchor="middle" fill="#065F46" font-size="11">Provider-native, not middleware</text>

  <!-- VS -->
  <text x="360" y="175" text-anchor="middle" font-size="20" font-weight="700" fill="#9CA3AF">vs</text>
</svg>
