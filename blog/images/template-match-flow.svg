<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#059669"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="480" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#1e293b">Template Match Step — Runtime Flow</text>

  <!-- Input -->
  <rect x="20" y="55" width="180" height="44" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="110" y="73" text-anchor="middle" font-size="12" fill="#0369a1" font-weight="600">YAML Playbook</text>
  <text x="110" y="88" text-anchor="middle" font-size="11" fill="#0369a1">match: { namespace, input, on }</text>

  <!-- Arrow to Walker -->
  <line x1="200" y1="77" x2="240" y2="77" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Walker -->
  <rect x="245" y="55" width="140" height="44" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="315" y="73" text-anchor="middle" font-size="12" fill="#92400e" font-weight="600">Walker</text>
  <text x="315" y="88" text-anchor="middle" font-size="11" fill="#92400e">→ TemplateMatchSpec</text>

  <!-- Arrow to Evaluator -->
  <line x1="385" y1="77" x2="425" y2="77" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Evaluator -->
  <rect x="430" y="55" width="140" height="44" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="500" y="73" text-anchor="middle" font-size="12" fill="#92400e" font-weight="600">Evaluator</text>
  <text x="500" y="88" text-anchor="middle" font-size="11" fill="#92400e">evaluateTemplateMatch()</text>

  <!-- Arrow to Registry -->
  <line x1="570" y1="77" x2="610" y2="77" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Registry -->
  <rect x="615" y="55" width="90" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="660" y="73" text-anchor="middle" font-size="12" fill="#1d4ed8" font-weight="600">Template</text>
  <text x="660" y="88" text-anchor="middle" font-size="11" fill="#1d4ed8">Registry</text>

  <!-- Match result arrow down -->
  <line x1="500" y1="99" x2="500" y2="140" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="510" y="125" font-size="10" fill="#64748b">TemplateMatch</text>

  <!-- Decision diamond -->
  <polygon points="500,145 560,175 500,205 440,175" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="500" y="178" text-anchor="middle" font-size="11" fill="#334155">Matched?</text>

  <!-- Yes arrow to handler dispatch -->
  <line x1="560" y1="175" x2="620" y2="175" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="590" y="168" font-size="10" fill="#059669">yes</text>

  <!-- Handler dispatch box -->
  <rect x="625" y="145" width="80" height="60" rx="6" fill="#dcfce7" stroke="#059669" stroke-width="1.5"/>
  <text x="665" y="167" text-anchor="middle" font-size="11" fill="#166534" font-weight="600">Dispatch</text>
  <text x="665" y="181" text-anchor="middle" font-size="10" fill="#166534">by template</text>
  <text x="665" y="195" text-anchor="middle" font-size="10" fill="#166534">name</text>

  <!-- No arrow to unmatched -->
  <line x1="440" y1="175" x2="380" y2="175" stroke="#dc2626" stroke-width="1.5"/>
  <text x="410" y="168" font-size="10" fill="#dc2626">no</text>
  <line x1="380" y1="175" x2="380" y2="225" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Unmatched handler -->
  <rect x="320" y="230" width="120" height="36" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="380" y="253" text-anchor="middle" font-size="11" fill="#991b1b">unmatched handler</text>

  <!-- Handler blocks section -->
  <rect x="30" y="280" width="660" height="185" rx="8" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="45" y="300" font-size="12" fill="#64748b" font-weight="600">Handler blocks (scoped variables)</text>

  <!-- Vote handler -->
  <rect x="50" y="315" width="285" height="135" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="65" y="335" font-size="12" fill="#166534" font-weight="600">on: vote</text>
  <text x="65" y="355" font-size="11" fill="#334155">scope: ${vote.decision}  → enum(approve|reject)</text>
  <text x="65" y="372" font-size="11" fill="#334155">scope: ${vote.subject}   → string</text>
  <text x="65" y="389" font-size="11" fill="#334155">scope: ${vote.rationale} → string (optional)</text>
  <line x1="65" y1="400" x2="320" y2="400" stroke="#d1d5db" stroke-width="0.5"/>
  <text x="65" y="418" font-size="11" fill="#64748b">context: ${_tmatch.namespace} = "protocol:review"</text>
  <text x="65" y="435" font-size="11" fill="#64748b">context: ${_tmatch.template} = "vote"</text>

  <!-- Escalate handler -->
  <rect x="365" y="315" width="310" height="135" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="380" y="335" font-size="12" fill="#166534" font-weight="600">on: escalate</text>
  <text x="380" y="355" font-size="11" fill="#334155">scope: ${escalate.target} → string</text>
  <text x="380" y="372" font-size="11" fill="#334155">scope: ${escalate.reason} → string</text>
  <line x1="380" y1="400" x2="660" y2="400" stroke="#d1d5db" stroke-width="0.5"/>
  <text x="380" y="418" font-size="11" fill="#64748b">context: ${_tmatch.namespace} = "protocol:review"</text>
  <text x="380" y="435" font-size="11" fill="#64748b">context: ${_tmatch.template} = "escalate"</text>

  <!-- Dispatch arrows to handlers -->
  <line x1="665" y1="205" x2="665" y2="260" stroke="#059669" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="665" y1="260" x2="520" y2="260" stroke="#059669" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="520" y1="260" x2="520" y2="315" stroke="#059669" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-green)"/>
  <line x1="192" y1="260" x2="192" y2="315" stroke="#059669" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-green)"/>
  <line x1="520" y1="260" x2="192" y2="260" stroke="#059669" stroke-width="1" stroke-dasharray="4,3"/>
</svg>
