<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="'Segoe UI', system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="340" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Annotation Pipeline — extraction only, no transformation</text>

  <!-- Raw YAML box -->
  <rect x="40" y="50" width="160" height="50" rx="6" fill="#fff" stroke="#94a3b8"/>
  <text x="120" y="72" text-anchor="middle" font-weight="500" fill="#334155">Raw YAML text</text>
  <text x="120" y="88" text-anchor="middle" font-size="11" fill="#64748b">(#@ lines are comments)</text>

  <!-- Arrow down to extractor -->
  <line x1="120" y1="100" x2="120" y2="130" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- AnnotationExtractor box -->
  <rect x="30" y="130" width="180" height="44" rx="6" fill="#dbeafe" stroke="#2563eb"/>
  <text x="120" y="156" text-anchor="middle" font-weight="600" fill="#1e40af">AnnotationExtractor</text>

  <!-- Two outputs from extractor -->
  <!-- Left: AnnotationMap -->
  <line x1="80" y1="174" x2="80" y2="210" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="16" y="210" width="128" height="40" rx="5" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="80" y="234" text-anchor="middle" font-weight="500" fill="#1d4ed8">AnnotationMap</text>

  <!-- Right: Same text (unmodified) -->
  <line x1="160" y1="174" x2="160" y2="210" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="120" y="210" width="140" height="40" rx="5" fill="#fff" stroke="#94a3b8"/>
  <text x="190" y="228" text-anchor="middle" font-size="12" fill="#334155">Same text</text>
  <text x="190" y="242" text-anchor="middle" font-size="10" fill="#64748b">(unmodified)</text>

  <!-- Arrow from same text to SnakeYAML -->
  <line x1="260" y1="230" x2="310" y2="230" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SnakeYAML box -->
  <rect x="310" y="210" width="130" height="40" rx="6" fill="#fff" stroke="#94a3b8"/>
  <text x="375" y="234" text-anchor="middle" font-weight="500" fill="#334155">SnakeYAML</text>

  <!-- Arrow from SnakeYAML to PlaybookDocument -->
  <line x1="440" y1="230" x2="490" y2="230" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- PlaybookDocument -->
  <rect x="490" y="210" width="150" height="40" rx="6" fill="#fff" stroke="#94a3b8"/>
  <text x="565" y="234" text-anchor="middle" font-weight="500" fill="#334155">PlaybookDocument</text>

  <!-- Arrow from PlaybookDocument down to Walker -->
  <line x1="565" y1="250" x2="565" y2="280" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow from AnnotationMap to Walker -->
  <path d="M80,250 L80,300 L350,300" stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#arrow-blue)" stroke-dasharray="6,3"/>

  <!-- Walker box -->
  <rect x="350" y="280" width="280" height="44" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="490" y="300" text-anchor="middle" font-weight="600" fill="#15803d">Walker.resolve(steps, registry, annotations)</text>
  <text x="490" y="315" text-anchor="middle" font-size="11" fill="#166534">→ ResolvedStep with annotations attached</text>
</svg>
