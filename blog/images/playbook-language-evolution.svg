<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="ev" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/>
    </marker>
    <linearGradient id="oldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fee2e2"/><stop offset="100%" stop-color="#fecaca"/>
    </linearGradient>
    <linearGradient id="newGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/><stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
  </defs>

  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#1e293b">Playbook Language — Before and After</text>

  <!-- BEFORE -->
  <rect x="30" y="50" width="340" height="340" rx="12" fill="url(#oldGrad)" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="200" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#991b1b">Before: Step Executor</text>

  <rect x="55" y="100" width="290" height="32" rx="6" fill="white" stroke="#fca5a5"/>
  <text x="200" y="121" text-anchor="middle" fill="#1e293b" font-size="12">steps:</text>
  <rect x="75" y="142" width="250" height="28" rx="6" fill="white" stroke="#fca5a5"/>
  <text x="200" y="161" text-anchor="middle" fill="#64748b" font-size="11">- agent-delegate: invoke(prompt)</text>
  <rect x="75" y="178" width="250" height="28" rx="6" fill="white" stroke="#fca5a5"/>
  <text x="200" y="197" text-anchor="middle" fill="#64748b" font-size="11">- rest-request: GET /api/data</text>
  <rect x="75" y="214" width="250" height="28" rx="6" fill="white" stroke="#fca5a5"/>
  <text x="200" y="233" text-anchor="middle" fill="#64748b" font-size="11">- if: condition → step</text>

  <text x="200" y="275" text-anchor="middle" font-size="11" fill="#991b1b" font-style="italic">Single-shot invocations only</text>
  <text x="200" y="295" text-anchor="middle" font-size="11" fill="#991b1b" font-style="italic">No sessions, no state, no streaming</text>
  <text x="200" y="315" text-anchor="middle" font-size="11" fill="#991b1b" font-style="italic">"steps:" ceremony required</text>
  <text x="200" y="335" text-anchor="middle" font-size="11" fill="#991b1b" font-style="italic">Step-prefixed type names</text>

  <!-- Arrow -->
  <line x1="380" y1="220" x2="420" y2="220" stroke="#475569" stroke-width="2" marker-end="url(#ev)"/>

  <!-- AFTER -->
  <rect x="430" y="50" width="340" height="340" rx="12" fill="url(#newGrad)" stroke="#86efac" stroke-width="1.5"/>
  <text x="600" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#166534">After: Agent Orchestrator</text>

  <rect x="455" y="95" width="290" height="28" rx="6" fill="white" stroke="#86efac"/>
  <text x="600" y="114" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="500">agent-session-open: analyst (from pool)</text>

  <rect x="455" y="129" width="290" height="28" rx="6" fill="white" stroke="#86efac"/>
  <text x="600" y="148" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="500">agent-query: session=analyst, prompt=...</text>

  <rect x="455" y="163" width="290" height="28" rx="6" fill="white" stroke="#86efac"/>
  <text x="600" y="182" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="500">streaming: source → transform → sink</text>

  <rect x="455" y="197" width="290" height="28" rx="6" fill="white" stroke="#86efac"/>
  <text x="600" y="216" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="500">advisory: evaluate governance protocol</text>

  <rect x="455" y="231" width="290" height="28" rx="6" fill="white" stroke="#86efac"/>
  <text x="600" y="250" text-anchor="middle" fill="#1e293b" font-size="11" font-weight="500">agent-session-close: analyst</text>

  <text x="600" y="285" text-anchor="middle" font-size="11" fill="#166534" font-style="italic">Multi-turn sessions with pool management</text>
  <text x="600" y="305" text-anchor="middle" font-size="11" fill="#166534" font-style="italic">AIMD admission + salience scheduling</text>
  <text x="600" y="325" text-anchor="middle" font-size="11" fill="#166534" font-style="italic">Pipe-fusible streaming pipelines</text>
  <text x="600" y="345" text-anchor="middle" font-size="11" fill="#166534" font-style="italic">No ceremony — steps are top-level</text>
  <text x="600" y="365" text-anchor="middle" font-size="11" fill="#166534" font-style="italic">Unified type names (Plugin, Walker, Result)</text>
</svg>
