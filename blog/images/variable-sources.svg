<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#64748b" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="340" rx="8" fill="#fafafa" stroke="#e2e8f0"/>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Four Variable Sources → One VariableResolver</text>

  <!-- Source boxes -->
  <g transform="translate(40, 60)">
    <rect width="140" height="70" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="70" y="28" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">params:</text>
    <text x="70" y="48" text-anchor="middle" font-size="11" fill="#475569">caller provides</text>
    <text x="70" y="62" text-anchor="middle" font-size="10" fill="#94a3b8">parse time</text>
  </g>

  <g transform="translate(220, 60)">
    <rect width="140" height="70" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
    <text x="70" y="28" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">vars:</text>
    <text x="70" y="48" text-anchor="middle" font-size="11" fill="#475569">local state</text>
    <text x="70" y="62" text-anchor="middle" font-size="10" fill="#94a3b8">parse time</text>
  </g>

  <g transform="translate(400, 60)">
    <rect width="140" height="70" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="70" y="28" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">@Inject</text>
    <text x="70" y="48" text-anchor="middle" font-size="11" fill="#475569">container provides</text>
    <text x="70" y="62" text-anchor="middle" font-size="10" fill="#94a3b8">future — #700</text>
  </g>

  <g transform="translate(540, 60)">
    <rect width="140" height="70" rx="6" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
    <text x="70" y="28" text-anchor="middle" font-size="13" font-weight="600" fill="#6b21a8">capture:</text>
    <text x="70" y="48" text-anchor="middle" font-size="11" fill="#475569">step output</text>
    <text x="70" y="62" text-anchor="middle" font-size="10" fill="#94a3b8">execution time</text>
  </g>

  <!-- Arrows down to resolver -->
  <line x1="110" y1="130" x2="360" y2="190" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="290" y1="130" x2="360" y2="190" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="470" y1="130" x2="360" y2="190" stroke="#64748b" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#arr)"/>
  <line x1="610" y1="130" x2="360" y2="190" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Resolver box -->
  <g transform="translate(260, 190)">
    <rect width="200" height="50" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
    <text x="100" y="30" text-anchor="middle" font-size="13" font-weight="600" fill="#f8fafc">VariableResolver</text>
  </g>

  <!-- Arrow down to resolution -->
  <line x1="360" y1="240" x2="360" y2="270" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Resolution examples -->
  <g transform="translate(120, 275)">
    <rect width="480" height="46" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="20" y="18" font-size="12" font-family="'JetBrains Mono', monospace" fill="#3b82f6">${params.portfolio}</text>
    <text x="200" y="18" font-size="12" font-family="'JetBrains Mono', monospace" fill="#22c55e">${var.retryCount}</text>
    <text x="380" y="18" font-size="12" font-family="'JetBrains Mono', monospace" fill="#a855f7">${capture.result}</text>
    <text x="240" y="38" text-anchor="middle" font-size="11" fill="#64748b">prefix-based resolution — same ${prefix.name} syntax everywhere</text>
  </g>
</svg>
