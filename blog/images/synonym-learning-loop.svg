<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#16a34a"/>
    </marker>
  </defs>

  <rect width="680" height="340" fill="#f8fafc" rx="8"/>
  <text x="340" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">Synonym Learning — Expensive Tiers Train Cheap Ones</text>

  <!-- First match -->
  <rect x="30" y="50" width="200" height="45" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="130" y="68" text-anchor="middle" font-weight="bold" fill="#92400e" font-size="12">1st Match</text>
  <text x="130" y="84" text-anchor="middle" fill="#475569" font-size="11">"I escalated the manager"</text>

  <line x1="230" y1="72" x2="265" y2="72" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Keyword affinity fails -->
  <rect x="270" y="50" width="160" height="45" rx="5" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="350" y="68" text-anchor="middle" fill="#991b1b" font-size="11" font-weight="bold">Keyword affinity: 0.0</text>
  <text x="350" y="84" text-anchor="middle" fill="#991b1b" font-size="11">"raise" ∉ input lemmas</text>

  <line x1="430" y1="72" x2="465" y2="72" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Embedding rescues -->
  <rect x="470" y="50" width="180" height="45" rx="5" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="560" y="68" text-anchor="middle" fill="#166534" font-size="11" font-weight="bold">Embedding rescue: 0.72</text>
  <text x="560" y="84" text-anchor="middle" fill="#166534" font-size="11">→ structural match ✓</text>

  <!-- Learn synonym arrow -->
  <path d="M 560 95 L 560 140 L 340 140" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="455" y="135" fill="#16a34a" font-size="12" font-weight="bold">learn: "raise" → "escalate"</text>

  <!-- Synonym store -->
  <rect x="180" y="125" width="160" height="35" rx="5" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="260" y="148" text-anchor="middle" fill="#3730a3" font-size="12" font-weight="bold">Synonym Map</text>

  <!-- Second match -->
  <rect x="30" y="195" width="200" height="45" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="130" y="213" text-anchor="middle" font-weight="bold" fill="#1e3a8a" font-size="12">2nd Match</text>
  <text x="130" y="229" text-anchor="middle" fill="#475569" font-size="11">"I escalated the director"</text>

  <line x1="230" y1="217" x2="265" y2="217" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Keyword affinity passes with synonyms -->
  <rect x="270" y="195" width="190" height="45" rx="5" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="365" y="213" text-anchor="middle" fill="#166534" font-size="11" font-weight="bold">Keyword affinity: 1.0</text>
  <text x="365" y="229" text-anchor="middle" fill="#166534" font-size="11">"raise" syn "escalate" ✓</text>

  <!-- Arrow from synonym store to keyword -->
  <path d="M 260 160 L 260 180 L 365 180 L 365 195" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>

  <line x1="460" y1="217" x2="495" y2="217" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- No embedding needed -->
  <rect x="500" y="195" width="150" height="45" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="575" y="213" text-anchor="middle" fill="#475569" font-size="11" font-weight="bold">Embedding: skipped</text>
  <text x="575" y="229" text-anchor="middle" fill="#475569" font-size="11">0 API calls</text>

  <!-- Summary bar -->
  <rect x="30" y="270" width="620" height="50" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="340" y="292" text-anchor="middle" fill="#166534" font-size="13" font-weight="bold">Result: expensive embedding call on first encounter → free keyword match on every repeat</text>
  <text x="340" y="310" text-anchor="middle" fill="#475569" font-size="11">The system gets faster as it sees more traffic — without retraining or reconfiguration</text>
</svg>
