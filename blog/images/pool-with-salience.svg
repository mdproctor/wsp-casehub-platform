<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#666"/>
    </marker>
  </defs>

  <text x="300" y="20" text-anchor="middle" font-size="14" font-weight="600" fill="#333">With salience: voice preempts, email gets guaranteed minimum</text>

  <!-- Initial state: email has 5, 1 reserved -->
  <rect x="60" y="45" width="480" height="30" rx="4" fill="#f0f0f0" stroke="#ccc"/>
  <text x="300" y="37" text-anchor="middle" font-size="11" fill="#888">6 slots — email(salience=0) active</text>

  <rect x="62" y="47" width="78" height="26" rx="3" fill="#93c5fd"/>
  <rect x="142" y="47" width="78" height="26" rx="3" fill="#93c5fd"/>
  <rect x="222" y="47" width="78" height="26" rx="3" fill="#93c5fd"/>
  <rect x="302" y="47" width="78" height="26" rx="3" fill="#93c5fd"/>
  <rect x="382" y="47" width="78" height="26" rx="3" fill="#93c5fd"/>
  <rect x="462" y="47" width="76" height="26" rx="3" fill="#e5e7eb" stroke="#d1d5db" stroke-dasharray="3,3"/>

  <text x="100" y="64" text-anchor="middle" font-size="10" fill="#1e40af">email</text>
  <text x="180" y="64" text-anchor="middle" font-size="10" fill="#1e40af">email</text>
  <text x="260" y="64" text-anchor="middle" font-size="10" fill="#1e40af">email</text>
  <text x="340" y="64" text-anchor="middle" font-size="10" fill="#1e40af">email</text>
  <text x="420" y="64" text-anchor="middle" font-size="10" fill="#1e40af">email</text>
  <text x="500" y="64" text-anchor="middle" font-size="9" fill="#9ca3af">reserved</text>

  <!-- Voice arrives -->
  <line x1="300" y1="95" x2="300" y2="115" stroke="#666" marker-end="url(#arrow2)"/>
  <text x="300" y="90" text-anchor="middle" font-size="12" fill="#16a34a" font-weight="600">Voice call arrives (salience=2)</text>

  <!-- After preemption -->
  <rect x="60" y="120" width="480" height="30" rx="4" fill="#f0f0f0" stroke="#ccc"/>
  <text x="300" y="112" text-anchor="middle" font-size="11" fill="#888">Voice gets slot immediately</text>

  <rect x="62" y="122" width="156" height="26" rx="3" fill="#bbf7d0" stroke="#16a34a"/>
  <rect x="222" y="122" width="78" height="26" rx="3" fill="#93c5fd"/>
  <rect x="302" y="122" width="78" height="26" rx="3" fill="#93c5fd"/>
  <rect x="382" y="122" width="78" height="26" rx="3" fill="#93c5fd"/>
  <rect x="462" y="122" width="76" height="26" rx="3" fill="#93c5fd"/>

  <text x="140" y="139" text-anchor="middle" font-size="11" fill="#15803d" font-weight="600">VOICE</text>
  <text x="260" y="139" text-anchor="middle" font-size="10" fill="#1e40af">email</text>
  <text x="340" y="139" text-anchor="middle" font-size="10" fill="#1e40af">email</text>
  <text x="420" y="139" text-anchor="middle" font-size="10" fill="#1e40af">email</text>
  <text x="500" y="139" text-anchor="middle" font-size="10" fill="#1e40af">email</text>

  <!-- Guaranteed minimum annotation -->
  <line x1="462" y1="160" x2="462" y2="175" stroke="#6b7280" stroke-dasharray="2,2"/>
  <line x1="540" y1="160" x2="540" y2="175" stroke="#6b7280" stroke-dasharray="2,2"/>
  <line x1="462" y1="175" x2="540" y2="175" stroke="#6b7280"/>
  <text x="501" y="190" text-anchor="middle" font-size="10" fill="#6b7280">guaranteed</text>
  <text x="501" y="202" text-anchor="middle" font-size="10" fill="#6b7280">min for email</text>

  <!-- Voice idle state -->
  <line x1="300" y1="215" x2="300" y2="235" stroke="#666" marker-end="url(#arrow2)"/>
  <text x="300" y="210" text-anchor="middle" font-size="12" fill="#666">Voice call ends — capacity flows back</text>

  <rect x="60" y="240" width="480" height="30" rx="4" fill="#f0f0f0" stroke="#ccc"/>
  <rect x="62" y="242" width="78" height="26" rx="3" fill="#93c5fd"/>
  <rect x="142" y="242" width="78" height="26" rx="3" fill="#93c5fd"/>
  <rect x="222" y="242" width="78" height="26" rx="3" fill="#93c5fd"/>
  <rect x="302" y="242" width="78" height="26" rx="3" fill="#93c5fd"/>
  <rect x="382" y="242" width="78" height="26" rx="3" fill="#93c5fd"/>
  <rect x="462" y="242" width="76" height="26" rx="3" fill="#93c5fd"/>

  <text x="300" y="289" text-anchor="middle" font-size="12" font-weight="600" fill="#16a34a">Voice SLA met. Email never starved.</text>
</svg>
