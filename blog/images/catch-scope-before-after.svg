<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 420" font-family="'Inter', 'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#64748b"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="390" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">What the catch block sees</text>

  <!-- BEFORE -->
  <text x="195" y="58" text-anchor="middle" font-size="13" font-weight="600" fill="#94a3b8">BEFORE</text>

  <!-- Before box -->
  <rect x="30" y="70" width="330" height="155" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>

  <text x="50" y="96" font-size="12" fill="#64748b" font-family="'JetBrains Mono', 'Fira Code', monospace">${error.message}</text>
  <text x="260" y="96" font-size="11" fill="#94a3b8">→ "original error"</text>

  <text x="50" y="122" font-size="12" fill="#64748b" font-family="'JetBrains Mono', 'Fira Code', monospace">${error.step}</text>
  <text x="260" y="122" font-size="11" fill="#94a3b8">→ "try-block"</text>

  <line x1="50" y1="140" x2="340" y2="140" stroke="#f1f5f9" stroke-width="1"/>

  <text x="195" y="165" text-anchor="middle" font-size="11" fill="#cbd5e1" font-style="italic">That's it. A string and a constant.</text>
  <text x="195" y="185" text-anchor="middle" font-size="11" fill="#cbd5e1" font-style="italic">Timeout? Rate limit? Auth denial?</text>
  <text x="195" y="205" text-anchor="middle" font-size="11" fill="#cbd5e1" font-style="italic">All look the same.</text>

  <!-- AFTER -->
  <text x="585" y="58" text-anchor="middle" font-size="13" font-weight="600" fill="#3b82f6">AFTER</text>

  <!-- After box -->
  <rect x="420" y="70" width="330" height="330" rx="8" fill="#fff" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>

  <text x="440" y="96" font-size="12" fill="#1e293b" font-family="'JetBrains Mono', 'Fira Code', monospace">${error.type}</text>
  <text x="620" y="96" font-size="11" fill="#3b82f6" font-weight="500">→ "rate-limit"</text>

  <text x="440" y="122" font-size="12" fill="#1e293b" font-family="'JetBrains Mono', 'Fira Code', monospace">${error.message}</text>
  <text x="620" y="122" font-size="11" fill="#64748b">→ "Agent rate limited"</text>

  <text x="440" y="148" font-size="12" fill="#1e293b" font-family="'JetBrains Mono', 'Fira Code', monospace">${error.step}</text>
  <text x="620" y="148" font-size="11" fill="#64748b">→ "try-block"</text>

  <text x="440" y="174" font-size="12" fill="#1e293b" font-family="'JetBrains Mono', 'Fira Code', monospace">${error.detail}</text>
  <text x="620" y="174" font-size="11" fill="#3b82f6" font-weight="500">→ Map</text>

  <line x1="440" y1="190" x2="730" y2="190" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Detail map contents -->
  <rect x="450" y="200" width="280" height="80" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="465" y="222" font-size="11" fill="#64748b" font-family="'JetBrains Mono', 'Fira Code', monospace">permitsPerSecond: 10.0</text>
  <text x="465" y="242" font-size="11" fill="#64748b" font-family="'JetBrains Mono', 'Fira Code', monospace">retryAfterMs: 5000</text>
  <text x="465" y="262" font-size="10" fill="#94a3b8" font-style="italic">fields vary by error type</text>

  <!-- Category examples -->
  <line x1="440" y1="295" x2="730" y2="295" stroke="#e2e8f0" stroke-width="1"/>
  <text x="440" y="315" font-size="10" fill="#94a3b8">21 error categories:</text>
  <text x="450" y="335" font-size="10" fill="#64748b" font-family="'JetBrains Mono', 'Fira Code', monospace">timeout  rate-limit  auth-denied</text>
  <text x="450" y="353" font-size="10" fill="#64748b" font-family="'JetBrains Mono', 'Fira Code', monospace">deadline-exceeded  action-failed</text>
  <text x="450" y="371" font-size="10" fill="#64748b" font-family="'JetBrains Mono', 'Fira Code', monospace">channel-closed  infrastructure</text>
  <text x="450" y="389" font-size="10" fill="#94a3b8">+ 14 more</text>

  <!-- Arrow from before to after -->
  <line x1="370" y1="147" x2="410" y2="147" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
