<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#475569" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Before -->
  <text x="200" y="24" text-anchor="middle" font-weight="bold" font-size="14" fill="#1e293b">Before</text>

  <rect x="30" y="40" width="160" height="36" rx="4" fill="#fef3c7" stroke="#d97706"/>
  <text x="110" y="63" text-anchor="middle" fill="#92400e">PlaybookRunnerCore</text>

  <rect x="220" y="40" width="160" height="36" rx="4" fill="#fecaca" stroke="#dc2626"/>
  <text x="300" y="63" text-anchor="middle" fill="#991b1b">TemplateMatchingFilter</text>

  <rect x="220" y="100" width="160" height="36" rx="4" fill="#fecaca" stroke="#dc2626"/>
  <text x="300" y="123" text-anchor="middle" fill="#991b1b">ProtocolEvaluator</text>

  <rect x="220" y="160" width="160" height="36" rx="4" fill="#fecaca" stroke="#dc2626"/>
  <text x="300" y="183" text-anchor="middle" fill="#991b1b">message-extraction</text>

  <line x1="190" y1="58" x2="218" y2="58" stroke="#475569" marker-end="url(#arr)"/>
  <line x1="300" y1="76" x2="300" y2="98" stroke="#475569" marker-end="url(#arr)"/>

  <text x="200" y="230" text-anchor="middle" font-size="11" fill="#64748b">Per-playbook isolated instances</text>
  <text x="200" y="246" text-anchor="middle" font-size="11" fill="#64748b">No cross-playbook composition</text>
  <text x="200" y="262" text-anchor="middle" font-size="11" fill="#dc2626">Duplicate template caches</text>

  <!-- After -->
  <text x="600" y="24" text-anchor="middle" font-weight="bold" font-size="14" fill="#1e293b">After</text>

  <rect x="470" y="40" width="160" height="36" rx="4" fill="#fef3c7" stroke="#d97706"/>
  <text x="550" y="63" text-anchor="middle" fill="#92400e">PlaybookRunnerCore</text>

  <rect x="680" y="40" width="100" height="36" rx="4" fill="#fef3c7" stroke="#d97706"/>
  <text x="730" y="63" text-anchor="middle" fill="#92400e">match step</text>

  <rect x="520" y="120" width="200" height="40" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="620" y="145" text-anchor="middle" font-weight="bold" fill="#166534">UnifiedTemplateRegistry</text>

  <line x1="550" y1="76" x2="580" y2="118" stroke="#475569" marker-end="url(#arr)"/>
  <line x1="730" y1="76" x2="660" y2="118" stroke="#475569" marker-end="url(#arr)"/>

  <text x="620" y="195" text-anchor="middle" font-size="11" fill="#64748b">Single shared registry</text>
  <text x="620" y="211" text-anchor="middle" font-size="11" fill="#64748b">Namespace-scoped templates</text>
  <text x="620" y="227" text-anchor="middle" font-size="11" fill="#16a34a">Atomic CAS swap</text>

  <!-- Deleted label -->
  <text x="300" y="295" text-anchor="middle" font-size="12" fill="#dc2626" font-weight="bold">~2,500 lines deleted</text>
  <text x="620" y="295" text-anchor="middle" font-size="12" fill="#16a34a" font-weight="bold">~250 lines added</text>
</svg>
