<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="440" rx="8" fill="#f8fafc"/>

  <!-- Title -->
  <text x="360" y="32" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Schema Architecture — Vocabulary Sources → IDE</text>

  <!-- Left column: Vocabulary Sources -->
  <rect x="30" y="60" width="200" height="50" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="130" y="82" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">StepKeywords.java</text>
  <text x="130" y="97" text-anchor="middle" font-size="10" fill="#3b82f6">14 structural + 28 decorator</text>

  <rect x="30" y="125" width="200" height="50" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="130" y="147" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">Walker.java</text>
  <text x="130" y="162" text-anchor="middle" font-size="10" fill="#3b82f6">15 combined-key prefixes</text>

  <rect x="30" y="190" width="200" height="50" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="130" y="212" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">@Plugin schemas</text>
  <text x="130" y="227" text-anchor="middle" font-size="10" fill="#3b82f6">3 APT-generated + 5 manual</text>

  <rect x="30" y="255" width="200" height="50" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="130" y="277" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">DeclarationParser.java</text>
  <text x="130" y="292" text-anchor="middle" font-size="10" fill="#3b82f6">12 invoke binding types</text>

  <!-- Center: Schema -->
  <rect x="280" y="130" width="160" height="120" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="360" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">playbook-document</text>
  <text x="360" y="183" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">.schema.json</text>
  <text x="360" y="206" text-anchor="middle" font-size="10" fill="#b45309">Draft 2020-12</text>
  <text x="360" y="222" text-anchor="middle" font-size="10" fill="#b45309">631 lines · flat step model</text>
  <text x="360" y="238" text-anchor="middle" font-size="10" fill="#b45309">patternProperties for</text>
  <text x="360" y="250" text-anchor="middle" font-size="10" fill="#b45309">combined keys</text>

  <!-- Right column: Outputs -->
  <rect x="490" y="80" width="200" height="50" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="590" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">IntelliJ YAML</text>
  <text x="590" y="115" text-anchor="middle" font-size="10" fill="#22c55e">autocompletion + validation</text>

  <rect x="490" y="145" width="200" height="50" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="590" y="165" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">VS Code YAML</text>
  <text x="590" y="180" text-anchor="middle" font-size="10" fill="#22c55e">autocompletion + validation</text>

  <rect x="490" y="210" width="200" height="50" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="590" y="230" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">Any JSON Schema</text>
  <text x="590" y="245" text-anchor="middle" font-size="10" fill="#22c55e">aware editor</text>

  <!-- Bottom: Drift Tests -->
  <rect x="240" y="310" width="240" height="100" rx="8" fill="#fce7f3" stroke="#f9a8d4" stroke-width="1.5"/>
  <text x="360" y="335" text-anchor="middle" font-size="12" font-weight="600" fill="#9d174d">Drift-Detection Tests</text>
  <text x="360" y="355" text-anchor="middle" font-size="10" fill="#be185d">structural keys ✓  decorator keys ✓</text>
  <text x="360" y="372" text-anchor="middle" font-size="10" fill="#be185d">plugin schemas ✓  combined keys ✓</text>
  <text x="360" y="389" text-anchor="middle" font-size="10" fill="#be185d">61 playbook + 7 test fixtures ✓</text>

  <!-- Arrows: sources → schema -->
  <line x1="230" y1="85" x2="278" y2="160" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="230" y1="150" x2="278" y2="175" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="230" y1="215" x2="278" y2="195" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="230" y1="280" x2="278" y2="215" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrows: schema → IDEs -->
  <line x1="440" y1="165" x2="488" y2="110" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="185" x2="488" y2="170" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="210" x2="488" y2="230" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow: tests ↔ schema -->
  <line x1="360" y1="308" x2="360" y2="252" stroke="#9d174d" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>

  <!-- Arrow: tests ← sources -->
  <line x1="130" y1="305" x2="260" y2="340" stroke="#9d174d" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="170" y="318" font-size="9" fill="#9d174d" transform="rotate(10, 170, 318)">verifies against</text>
</svg>
