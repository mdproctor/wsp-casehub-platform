<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, -apple-system, sans-serif">
  <style>
    .box { stroke: #374151; stroke-width: 1.5; rx: 6; }
    .event-box { fill: #DBEAFE; }
    .trigger-box { fill: #FEF3C7; }
    .selector-box { fill: #D1FAE5; }
    .corpus-box { fill: #EDE9FE; }
    .label { font-size: 11px; fill: #6B7280; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    .title { font-size: 13px; fill: #111827; font-weight: 600; }
    .detail { font-size: 11px; fill: #4B5563; }
    .arrow { stroke: #9CA3AF; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    .arrow-label { font-size: 10px; fill: #6B7280; font-style: italic; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9CA3AF"/>
    </marker>
  </defs>

  <!-- CloudEvent -->
  <rect class="box event-box" x="20" y="30" width="160" height="70"/>
  <text class="label" x="100" y="52" text-anchor="middle">CloudEvent</text>
  <text class="title" x="100" y="72" text-anchor="middle">capacity.pressure</text>
  <text class="detail" x="100" y="88" text-anchor="middle">pressure: 0.92</text>

  <!-- Arrow: event → triggers -->
  <path class="arrow" d="M 180,65 L 230,65"/>

  <!-- Triggers block -->
  <rect class="box trigger-box" x="240" y="15" width="200" height="100"/>
  <text class="label" x="340" y="36" text-anchor="middle">triggers (top-level)</text>
  <text class="title" x="340" y="58" text-anchor="middle">pressure-high</text>
  <text class="detail" x="340" y="76" text-anchor="middle">event-type: capacity.pressure</text>
  <text class="detail" x="340" y="92" text-anchor="middle">condition: pressure &gt; 0.8</text>

  <!-- Arrow: triggers → selector -->
  <path class="arrow" d="M 440,65 L 490,65"/>
  <text class="arrow-label" x="465" y="58" text-anchor="middle">advance</text>

  <!-- Shared selector -->
  <rect class="box selector-box" x="500" y="20" width="200" height="90"/>
  <text class="label" x="600" y="42" text-anchor="middle">Shared Selector</text>
  <text class="title" x="600" y="62" text-anchor="middle">StateMachineSelector</text>
  <text class="detail" x="600" y="80" text-anchor="middle">normal → degraded</text>
  <text class="detail" x="600" y="96" text-anchor="middle">(one instance, N methods)</text>

  <!-- Two PhasedCorpus boxes below -->
  <path class="arrow" d="M 560,110 L 560,155"/>
  <path class="arrow" d="M 640,110 L 640,155"/>

  <!-- Method A -->
  <rect class="box corpus-box" x="460" y="160" width="200" height="80"/>
  <text class="label" x="560" y="182" text-anchor="middle">PhasedCorpus</text>
  <text class="title" x="560" y="202" text-anchor="middle">payment.charge</text>
  <text class="detail" x="560" y="220" text-anchor="middle">normal: APPROVED</text>
  <text class="detail" x="560" y="234" text-anchor="middle">degraded: UNAVAILABLE</text>

  <!-- Method B (offset right and down) -->
  <rect class="box corpus-box" x="460" y="255" width="200" height="80"/>
  <text class="label" x="560" y="277" text-anchor="middle">PhasedCorpus</text>
  <text class="title" x="560" y="297" text-anchor="middle">payment.refund</text>
  <text class="detail" x="560" y="315" text-anchor="middle">normal: REFUNDED</text>
  <text class="detail" x="560" y="329" text-anchor="middle">degraded: UNAVAILABLE</text>

  <!-- Dashed box around both PhasedCorpus -->
  <rect x="450" y="148" width="220" height="195" rx="8" fill="none" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="6,4"/>
  <text class="arrow-label" x="560" y="145" text-anchor="middle">profile: outage-scenario</text>
</svg>
