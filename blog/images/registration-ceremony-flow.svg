<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#475569" stroke-width="1.5"/>
    </marker>
    <linearGradient id="authGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="regGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="storeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="410" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#1e293b">Two Ceremonies, One Identity</text>

  <!-- Authentication ceremony (left) -->
  <rect x="30" y="55" width="360" height="200" rx="12" fill="url(#authGrad)" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="210" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">Authentication Ceremony</text>
  <text x="210" y="100" text-anchor="middle" font-size="11" fill="#3b82f6" font-style="italic">Prove who you are</text>

  <rect x="55" y="115" width="130" height="36" rx="6" fill="white" stroke="#93c5fd"/>
  <text x="120" y="138" text-anchor="middle" fill="#1e293b">initiate(ctx)</text>

  <line x1="185" y1="133" x2="225" y2="133" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="225" y="115" width="140" height="36" rx="6" fill="white" stroke="#93c5fd"/>
  <text x="295" y="138" text-anchor="middle" fill="#1e293b">verify(challenge)</text>

  <rect x="55" y="170" width="310" height="36" rx="6" fill="white" stroke="#93c5fd"/>
  <text x="210" y="193" text-anchor="middle" fill="#1e293b">→ AuthenticationResult(PrincipalId)</text>

  <text x="210" y="236" text-anchor="middle" font-size="11" fill="#64748b">UserResolver.resolveByEmail() — read-only query</text>

  <!-- Registration ceremony (right) -->
  <rect x="430" y="55" width="360" height="200" rx="12" fill="url(#regGrad)" stroke="#86efac" stroke-width="1.5"/>
  <text x="610" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="#166534">Registration Ceremony</text>
  <text x="610" y="100" text-anchor="middle" font-size="11" fill="#22c55e" font-style="italic">Create who you are</text>

  <rect x="455" y="115" width="130" height="36" rx="6" fill="white" stroke="#86efac"/>
  <text x="520" y="138" text-anchor="middle" fill="#1e293b">register(req)</text>

  <line x1="585" y1="133" x2="625" y2="133" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="625" y="115" width="140" height="36" rx="6" fill="white" stroke="#86efac"/>
  <text x="695" y="138" text-anchor="middle" fill="#1e293b">verifyEmail(tok)</text>

  <rect x="455" y="170" width="310" height="36" rx="6" fill="white" stroke="#86efac"/>
  <text x="610" y="193" text-anchor="middle" fill="#1e293b">→ RegistrationResult(UserRecord)</text>

  <text x="610" y="236" text-anchor="middle" font-size="11" fill="#64748b">UserStore.create() — write command</text>

  <!-- CQS label -->
  <rect x="280" y="270" width="260" height="32" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="410" y="291" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">CQS: queries don't create, commands don't query</text>

  <!-- Social login bridge -->
  <rect x="130" y="330" width="560" height="170" rx="12" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="410" y="355" text-anchor="middle" font-size="14" font-weight="600" fill="#6d28d9">Social Login — Bridge Between Ceremonies</text>

  <rect x="155" y="375" width="160" height="36" rx="6" fill="white" stroke="#c4b5fd"/>
  <text x="235" y="398" text-anchor="middle" fill="#1e293b">UserResolver</text>
  <text x="235" y="418" text-anchor="middle" font-size="11" fill="#64748b">resolve email → empty</text>

  <line x1="315" y1="393" x2="375" y2="393" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="345" y="385" text-anchor="middle" font-size="10" fill="#94a3b8">miss</text>

  <rect x="375" y="375" width="160" height="36" rx="6" fill="white" stroke="#c4b5fd"/>
  <text x="455" y="398" text-anchor="middle" fill="#1e293b">UserProvisioner</text>
  <text x="455" y="418" text-anchor="middle" font-size="11" fill="#64748b">check policy → create</text>

  <line x1="535" y1="393" x2="585" y2="393" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="585" y="375" width="80" height="36" rx="6" fill="url(#storeGrad)" stroke="#f59e0b"/>
  <text x="625" y="398" text-anchor="middle" fill="#1e293b">UserStore</text>

  <text x="410" y="478" text-anchor="middle" font-size="11" fill="#7c3aed">UserResolver stays read-only. UserProvisioner is the command.</text>
  <text x="410" y="495" text-anchor="middle" font-size="11" fill="#7c3aed">Account-takeover guard: never auto-links to existing accounts.</text>
</svg>
