<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arr2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#475569" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Snapshot box -->
  <rect x="40" y="20" width="620" height="260" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="60" y="44" font-weight="bold" font-size="14" fill="#334155">Atomic Snapshot (CAS-swapped)</text>

  <!-- Current namespace -->
  <rect x="70" y="60" width="260" height="80" rx="4" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <text x="200" y="82" text-anchor="middle" font-weight="bold" fill="#166534">Current: v3</text>
  <text x="200" y="102" text-anchor="middle" font-size="11" fill="#166534">protocol:review</text>
  <text x="200" y="120" text-anchor="middle" font-size="11" fill="#166534">compiled templates + patterns</text>

  <!-- Version ring -->
  <rect x="70" y="160" width="260" height="100" rx="4" fill="#fef3c7" stroke="#d97706"/>
  <text x="200" y="182" text-anchor="middle" font-weight="bold" fill="#92400e">Version Ring (max 3)</text>

  <rect x="85" y="195" width="70" height="28" rx="3" fill="#fff7ed" stroke="#d97706"/>
  <text x="120" y="214" text-anchor="middle" font-size="11" fill="#92400e">v1</text>

  <rect x="165" y="195" width="70" height="28" rx="3" fill="#fff7ed" stroke="#d97706"/>
  <text x="200" y="214" text-anchor="middle" font-size="11" fill="#92400e">v2</text>

  <rect x="245" y="195" width="70" height="28" rx="3" fill="#e5e7eb" stroke="#9ca3af" stroke-dasharray="4,2"/>
  <text x="280" y="214" text-anchor="middle" font-size="11" fill="#6b7280">(slot)</text>

  <text x="200" y="250" text-anchor="middle" font-size="10" fill="#78716c">each entry: namespace + compiled templates</text>

  <!-- Match dispatch -->
  <rect x="400" y="70" width="230" height="50" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="515" y="92" text-anchor="middle" fill="#1e40af">match("review", input, v2)</text>
  <text x="515" y="108" text-anchor="middle" font-size="10" fill="#3b82f6">→ looks up ring, matches v2</text>

  <rect x="400" y="150" width="230" height="50" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="515" y="172" text-anchor="middle" fill="#1e40af">match("review", input)</text>
  <text x="515" y="188" text-anchor="middle" font-size="10" fill="#3b82f6">→ always matches current (v3)</text>

  <rect x="400" y="230" width="230" height="34" rx="4" fill="#fecaca" stroke="#dc2626"/>
  <text x="515" y="252" text-anchor="middle" font-size="11" fill="#991b1b">v0 evicted → VersionNotFoundException</text>

  <!-- Arrows -->
  <line x1="330" y1="100" x2="398" y2="95" stroke="#475569" marker-end="url(#arr2)"/>
  <line x1="330" y1="210" x2="398" y2="175" stroke="#475569" marker-end="url(#arr2)"/>
</svg>
