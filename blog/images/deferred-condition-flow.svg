<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Phase backgrounds -->
  <rect x="20" y="10" width="340" height="460" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="6,3"/>
  <text x="190" y="34" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">Phase 1 — Expansion Time</text>

  <rect x="400" y="10" width="340" height="460" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-dasharray="6,3"/>
  <text x="570" y="34" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">Phase 2 — Runtime</text>

  <!-- Phase 1: Import condition found -->
  <rect x="70" y="60" width="240" height="36" rx="6" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="190" y="83" text-anchor="middle" fill="#312e81">Import condition found</text>

  <line x1="190" y1="96" x2="190" y2="120" stroke="#475569" marker-end="url(#arrow)"/>

  <!-- Phase 1: Resolve -->
  <rect x="70" y="120" width="240" height="36" rx="6" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="190" y="143" text-anchor="middle" fill="#312e81">Resolve with module.* scope</text>

  <line x1="190" y1="156" x2="190" y2="185" stroke="#475569" marker-end="url(#arrow)"/>

  <!-- Phase 1: Fully resolved? diamond -->
  <polygon points="190,185 275,230 190,275 105,230" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="190" y="234" text-anchor="middle" fill="#92400e" font-size="12">Fully resolved?</text>

  <!-- Yes branch (left) -->
  <line x1="105" y1="230" x2="60" y2="230" stroke="#475569"/>
  <text x="82" y="222" text-anchor="middle" fill="#475569" font-size="11">yes</text>

  <!-- Truthy? diamond (smaller, offset left) -->
  <polygon points="60,255 100,285 60,315 20,285" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="60" y="289" text-anchor="middle" fill="#92400e" font-size="11">truthy?</text>

  <!-- truthy? -> no -> Skip import -->
  <line x1="60" y1="315" x2="60" y2="348" stroke="#dc2626" marker-end="url(#arrow-red)"/>
  <text x="70" y="336" fill="#dc2626" font-size="11">no</text>
  <rect x="20" y="348" width="80" height="30" rx="4" fill="#fef2f2" stroke="#dc2626"/>
  <text x="60" y="368" text-anchor="middle" fill="#991b1b" font-size="11">Skip import</text>

  <!-- truthy? -> yes -> Include -->
  <line x1="100" y1="285" x2="150" y2="285" stroke="#16a34a" marker-end="url(#arrow-green)"/>
  <text x="125" y="278" text-anchor="middle" fill="#16a34a" font-size="11">yes</text>
  <rect x="150" y="270" width="80" height="30" rx="4" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="190" y="290" text-anchor="middle" fill="#166534" font-size="11">Include</text>

  <!-- No branch (right) -> Deferred -->
  <line x1="275" y1="230" x2="320" y2="230" stroke="#475569"/>
  <text x="295" y="222" text-anchor="middle" fill="#475569" font-size="11">no</text>
  <line x1="320" y1="230" x2="320" y2="348" stroke="#475569"/>

  <rect x="245" y="348" width="150" height="44" rx="6" fill="#fef9c3" stroke="#eab308"/>
  <text x="320" y="366" text-anchor="middle" fill="#854d0e" font-size="11">Include + defer</text>
  <text x="320" y="381" text-anchor="middle" fill="#854d0e" font-size="11">condition to runtime</text>

  <!-- Dashed arrow from Phase 1 to Phase 2 -->
  <line x1="395" y1="370" x2="440" y2="370" stroke="#475569" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- Phase 2: Build VariableResolver -->
  <rect x="440" y="60" width="260" height="50" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="570" y="80" text-anchor="middle" fill="#166534" font-weight="bold">Build VariableResolver</text>
  <text x="570" y="98" text-anchor="middle" fill="#166534" font-size="11">(var, params, module scopes)</text>

  <line x1="570" y1="110" x2="570" y2="140" stroke="#475569" marker-end="url(#arrow)"/>

  <!-- Phase 2: Resolve deferred conditions -->
  <rect x="440" y="140" width="260" height="36" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="570" y="163" text-anchor="middle" fill="#166534">Resolve deferred conditions</text>

  <line x1="570" y1="176" x2="570" y2="210" stroke="#475569" marker-end="url(#arrow)"/>

  <!-- Phase 2: Condition met? diamond -->
  <polygon points="570,210 655,255 570,300 485,255" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="570" y="259" text-anchor="middle" fill="#92400e" font-size="12">Condition met?</text>

  <!-- yes -> Inline steps -->
  <line x1="655" y1="255" x2="710" y2="255" stroke="#16a34a" marker-end="url(#arrow-green)"/>
  <text x="680" y="248" text-anchor="middle" fill="#16a34a" font-size="11">yes</text>
  <rect x="700" y="240" width="50" height="30" rx="4" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="725" y="260" text-anchor="middle" fill="#166534" font-size="11">Inline</text>

  <!-- no -> Skip use: steps -->
  <line x1="570" y1="300" x2="570" y2="340" stroke="#dc2626" marker-end="url(#arrow-red)"/>
  <text x="580" y="324" fill="#dc2626" font-size="11">no</text>

  <rect x="440" y="340" width="260" height="44" rx="6" fill="#fef2f2" stroke="#dc2626"/>
  <text x="570" y="358" text-anchor="middle" fill="#991b1b" font-size="12">Skip use: steps</text>
  <text x="570" y="374" text-anchor="middle" fill="#991b1b" font-size="11">for inactive alias</text>

  <!-- Phase 2: expandUseSteps -->
  <rect x="440" y="410" width="260" height="36" rx="6" fill="#dcfce7" stroke="#16a34a"/>
  <text x="570" y="433" text-anchor="middle" fill="#166534" font-size="12">expandUseSteps(inactiveAliases)</text>

  <line x1="570" y1="384" x2="570" y2="410" stroke="#475569" marker-end="url(#arrow)"/>
  <line x1="725" y1="270" x2="725" y2="425" stroke="#16a34a"/>
  <line x1="725" y1="425" x2="700" y2="425" stroke="#16a34a" marker-end="url(#arrow-green)"/>
</svg>
