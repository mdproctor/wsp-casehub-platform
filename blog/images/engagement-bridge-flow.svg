<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="Inter, system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#475569"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#1e293b">Engagement Recording — Before and After the sourceId Fix</text>

  <!-- BEFORE section -->
  <rect x="20" y="50" width="370" height="340" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="205" y="72" text-anchor="middle" font-size="14" font-weight="600" fill="#991b1b">Before — sourceId always null</text>

  <!-- Before: boxes -->
  <rect x="40" y="90" width="140" height="36" rx="5" fill="#fff" stroke="#94a3b8"/>
  <text x="110" y="113" text-anchor="middle" fill="#334155">InApp Deliverer</text>

  <rect x="40" y="155" width="140" height="36" rx="5" fill="#fff" stroke="#94a3b8"/>
  <text x="110" y="178" text-anchor="middle" fill="#334155">Delivery Tracker</text>

  <rect x="40" y="225" width="140" height="36" rx="5" fill="#fff" stroke="#94a3b8"/>
  <text x="110" y="248" text-anchor="middle" fill="#334155">DeliveryAttempt</text>

  <rect x="220" y="225" width="150" height="36" rx="5" fill="#fff" stroke="#94a3b8"/>
  <text x="295" y="248" text-anchor="middle" fill="#334155">Engagement Bridge</text>

  <!-- Before: arrows -->
  <line x1="110" y1="126" x2="110" y2="152" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="165" y="143" fill="#64748b" font-size="11">sourceId = null</text>

  <line x1="110" y1="191" x2="110" y2="222" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="165" y="210" fill="#64748b" font-size="11">stores with null</text>

  <line x1="295" y1="261" x2="183" y2="252" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-red)"/>
  <text x="210" y="290" fill="#dc2626" font-size="11" font-weight="600">findBySource(notifId)</text>
  <text x="210" y="305" fill="#dc2626" font-size="11" font-weight="600">→ empty list ✗</text>

  <!-- Result box -->
  <rect x="220" y="325" width="150" height="50" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="295" y="348" text-anchor="middle" fill="#991b1b" font-weight="600" font-size="12">No engagement</text>
  <text x="295" y="365" text-anchor="middle" fill="#991b1b" font-size="11">recorded — ever</text>

  <line x1="295" y1="261" x2="295" y2="322" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <!-- AFTER section -->
  <rect x="410" y="50" width="370" height="340" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="595" y="72" text-anchor="middle" font-size="14" font-weight="600" fill="#166534">After — sourceId = notification.id()</text>

  <!-- After: boxes -->
  <rect x="430" y="90" width="140" height="36" rx="5" fill="#fff" stroke="#94a3b8"/>
  <text x="500" y="113" text-anchor="middle" fill="#334155">InApp Deliverer</text>

  <rect x="430" y="155" width="140" height="36" rx="5" fill="#fff" stroke="#94a3b8"/>
  <text x="500" y="178" text-anchor="middle" fill="#334155">Delivery Tracker</text>

  <rect x="430" y="225" width="140" height="36" rx="5" fill="#fff" stroke="#94a3b8"/>
  <text x="500" y="248" text-anchor="middle" fill="#334155">DeliveryAttempt</text>

  <rect x="610" y="225" width="150" height="36" rx="5" fill="#fff" stroke="#94a3b8"/>
  <text x="685" y="248" text-anchor="middle" fill="#334155">Engagement Bridge</text>

  <!-- After: arrows -->
  <line x1="500" y1="126" x2="500" y2="152" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="555" y="143" fill="#16a34a" font-size="11" font-weight="600">sourceId = notif.id()</text>

  <line x1="500" y1="191" x2="500" y2="222" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="555" y="210" fill="#16a34a" font-size="11" font-weight="600">stores with ID</text>

  <line x1="685" y1="261" x2="573" y2="252" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="290" fill="#16a34a" font-size="11" font-weight="600">findBySource(notifId)</text>
  <text x="600" y="305" fill="#16a34a" font-size="11" font-weight="600">→ found ✓</text>

  <!-- Result box -->
  <rect x="610" y="325" width="150" height="50" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="685" y="348" text-anchor="middle" fill="#166534" font-weight="600" font-size="12">Engagement</text>
  <text x="685" y="365" text-anchor="middle" fill="#166534" font-size="11">recorded ✓</text>

  <line x1="685" y1="261" x2="685" y2="322" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
