<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#1e293b">Parameter Resolution — Before and After</text>

  <!-- BEFORE side -->
  <rect x="20" y="50" width="330" height="330" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="185" y="72" text-anchor="middle" font-size="14" font-weight="600" fill="#991b1b">Before: Everything → VariableResolver</text>

  <!-- YAML box -->
  <rect x="40" y="90" width="290" height="50" rx="4" fill="#fff" stroke="#d1d5db"/>
  <text x="185" y="110" text-anchor="middle" font-size="12" font-family="monospace" fill="#374151">assertThat: ${results.output.risk}</text>
  <text x="185" y="128" text-anchor="middle" font-size="11" fill="#9ca3af">YAML author adds ${...} wrapper</text>

  <!-- Arrow down -->
  <line x1="185" y1="140" x2="185" y2="160" stroke="#475569" marker-end="url(#arrow)"/>

  <!-- VariableResolver -->
  <rect x="80" y="165" width="210" height="35" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="185" y="187" text-anchor="middle" font-size="12" font-weight="500" fill="#1e40af">VariableResolver (blind)</text>

  <!-- Arrow down -->
  <line x1="185" y1="200" x2="185" y2="220" stroke="#475569" marker-end="url(#arrow)"/>

  <!-- Plugin box -->
  <rect x="40" y="225" width="290" height="80" rx="4" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="185" y="247" text-anchor="middle" font-size="12" font-weight="500" fill="#92400e">AssertThatPlugin.resolveSubject()</text>
  <text x="185" y="265" text-anchor="middle" font-size="11" fill="#a16207">↳ strip ${...}</text>
  <text x="185" y="280" text-anchor="middle" font-size="11" fill="#a16207">↳ lookup ExpressionEngineRegistry</text>
  <text x="185" y="295" text-anchor="middle" font-size="11" fill="#a16207">↳ compile &amp; evaluate</text>

  <!-- Arrow down -->
  <line x1="185" y1="305" x2="185" y2="325" stroke="#475569" marker-end="url(#arrow)"/>

  <!-- Result -->
  <rect x="100" y="330" width="170" height="35" rx="4" fill="#dcfce7" stroke="#86efac"/>
  <text x="185" y="352" text-anchor="middle" font-size="12" font-weight="500" fill="#166534">"equities"</text>

  <!-- AFTER side -->
  <rect x="370" y="50" width="330" height="330" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="535" y="72" text-anchor="middle" font-size="14" font-weight="600" fill="#166534">After: Type-Aware Resolution</text>

  <!-- YAML box -->
  <rect x="390" y="90" width="290" height="50" rx="4" fill="#fff" stroke="#d1d5db"/>
  <text x="535" y="110" text-anchor="middle" font-size="12" font-family="monospace" fill="#374151">assertThat: results.output.risk</text>
  <text x="535" y="128" text-anchor="middle" font-size="11" fill="#9ca3af">Schema says: EXPRESSION type</text>

  <!-- Arrow down -->
  <line x1="535" y1="140" x2="535" y2="160" stroke="#475569" marker-end="url(#arrow)"/>

  <!-- TypeAwareParamResolver -->
  <rect x="410" y="165" width="250" height="35" rx="4" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="535" y="187" text-anchor="middle" font-size="12" font-weight="500" fill="#1e40af">TypeAwareParamResolver (typed)</text>

  <!-- Arrow down to ExpressionEngine -->
  <line x1="535" y1="200" x2="535" y2="220" stroke="#475569" marker-end="url(#arrow)"/>

  <!-- ExpressionEngine -->
  <rect x="430" y="225" width="210" height="40" rx="4" fill="#e0e7ff" stroke="#a5b4fc"/>
  <text x="535" y="243" text-anchor="middle" font-size="12" font-weight="500" fill="#3730a3">ExpressionEngine</text>
  <text x="535" y="258" text-anchor="middle" font-size="11" fill="#6366f1">compile → eval (automatic)</text>

  <!-- Arrow down -->
  <line x1="535" y1="265" x2="535" y2="325" stroke="#475569" marker-end="url(#arrow)"/>

  <!-- Plugin box (minimal) -->
  <rect x="430" y="280" width="210" height="30" rx="4" fill="#f5f5f5" stroke="#d1d5db" stroke-dasharray="4"/>
  <text x="535" y="300" text-anchor="middle" font-size="11" fill="#9ca3af">Plugin receives evaluated value</text>

  <!-- Result -->
  <rect x="450" y="330" width="170" height="35" rx="4" fill="#dcfce7" stroke="#86efac"/>
  <text x="535" y="352" text-anchor="middle" font-size="12" font-weight="500" fill="#166534">"equities"</text>
</svg>
