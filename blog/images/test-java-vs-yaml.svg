<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" font-family="'Inter', 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="javaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fee2e2"/>
      <stop offset="100%" stop-color="#fecaca"/>
    </linearGradient>
    <linearGradient id="yamlTestGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
  </defs>

  <!-- Java side -->
  <rect x="20" y="20" width="320" height="240" rx="8" fill="url(#javaGrad)" stroke="#ef4444" stroke-width="1.5"/>
  <text x="180" y="46" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b">Java Integration Test</text>
  <line x1="35" y1="56" x2="325" y2="56" stroke="#fca5a5" stroke-width="1"/>

  <rect x="35" y="66" width="135" height="46" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="102" y="86" text-anchor="middle" font-size="9" font-weight="500" fill="#991b1b">Corpus builder</text>
  <text x="102" y="100" text-anchor="middle" font-size="8" fill="#dc2626">if-contains patterns</text>

  <rect x="180" y="66" width="148" height="46" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="254" y="86" text-anchor="middle" font-size="9" font-weight="500" fill="#991b1b">Session pipeline</text>
  <text x="254" y="100" text-anchor="middle" font-size="8" fill="#dc2626">handler wiring</text>

  <rect x="35" y="120" width="135" height="46" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="102" y="140" text-anchor="middle" font-size="9" font-weight="500" fill="#991b1b">Mock backends</text>
  <text x="102" y="154" text-anchor="middle" font-size="8" fill="#dc2626">manual construction</text>

  <rect x="180" y="120" width="148" height="46" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="254" y="140" text-anchor="middle" font-size="9" font-weight="500" fill="#991b1b">CDI injection</text>
  <text x="254" y="154" text-anchor="middle" font-size="8" fill="#dc2626">@QuarkusTest setup</text>

  <rect x="35" y="174" width="293" height="36" rx="4" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="180" y="197" text-anchor="middle" font-size="9" font-weight="600" fill="#991b1b">Actual test logic (5% of file)</text>

  <text x="180" y="238" text-anchor="middle" font-size="22" font-weight="700" fill="#991b1b">~520 lines</text>

  <!-- YAML side -->
  <rect x="380" y="20" width="320" height="240" rx="8" fill="url(#yamlTestGrad)" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="540" y="46" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">.test.yaml</text>
  <line x1="395" y1="56" x2="685" y2="56" stroke="#93c5fd" stroke-width="1"/>

  <rect x="395" y="66" width="290" height="46" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="540" y="86" text-anchor="middle" font-size="9" font-weight="500" fill="#1e40af">simulate:</text>
  <text x="540" y="100" text-anchor="middle" font-size="8" fill="#3b82f6">prompt → response (inline or corpus file)</text>

  <rect x="395" y="120" width="290" height="80" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="540" y="140" text-anchor="middle" font-size="9" font-weight="500" fill="#1e40af">steps:</text>
  <text x="540" y="156" text-anchor="middle" font-size="8" fill="#3b82f6">agent-invoke → capture → assertThat</text>
  <text x="540" y="172" text-anchor="middle" font-size="9" font-style="italic" fill="#6b7280">Test logic IS the file</text>
  <text x="540" y="188" text-anchor="middle" font-size="8" fill="#3b82f6">Same steps as production playbooks</text>

  <text x="540" y="238" text-anchor="middle" font-size="22" font-weight="700" fill="#1e40af">~20 lines</text>

  <!-- Reduction arrow -->
  <text x="360" y="272" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">26× reduction — same coverage, readable as documentation</text>
</svg>
