<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Source box -->
  <rect x="40" y="140" width="200" height="120" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="140" y="170" text-anchor="middle" font-size="13" font-weight="600" fill="#1e293b">@McpDomain</text>
  <text x="140" y="192" text-anchor="middle" font-size="11" fill="#64748b">@PlatformQuery</text>
  <text x="140" y="208" text-anchor="middle" font-size="11" fill="#64748b">@PlatformMutation</text>
  <text x="140" y="230" text-anchor="middle" font-size="10" fill="#94a3b8">+ @GeneratePlugin</text>

  <!-- APT processor -->
  <rect x="290" y="160" width="140" height="80" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="360" y="195" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">GraphQL</text>
  <text x="360" y="212" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">ResolverProcessor</text>

  <!-- Arrow: source → APT -->
  <line x1="240" y1="200" x2="286" y2="200" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Output 1: GraphQL -->
  <rect x="500" y="20" width="180" height="50" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="590" y="42" text-anchor="middle" font-size="11" font-weight="500" fill="#166534">GraphQL Resolver</text>
  <text x="590" y="58" text-anchor="middle" font-size="10" fill="#4ade80">@GraphQLApi @Query</text>

  <!-- Output 2: REST -->
  <rect x="500" y="90" width="180" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="590" y="112" text-anchor="middle" font-size="11" font-weight="500" fill="#92400e">REST Resource</text>
  <text x="590" y="128" text-anchor="middle" font-size="10" fill="#fbbf24">@Path @GET/@POST</text>

  <!-- Output 3: MCP (via GraphQLModelScanner) -->
  <rect x="500" y="160" width="180" height="50" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.2" filter="url(#shadow)"/>
  <text x="590" y="182" text-anchor="middle" font-size="11" font-weight="500" fill="#5b21b6">MCP Tool</text>
  <text x="590" y="198" text-anchor="middle" font-size="10" fill="#a78bfa">casehub_action</text>

  <!-- Output 4: Plugin (NEW) -->
  <rect x="500" y="230" width="180" height="70" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="590" y="255" text-anchor="middle" font-size="12" font-weight="600" fill="#9d174d">@Plugin Record</text>
  <text x="590" y="273" text-anchor="middle" font-size="10" fill="#f472b6">YAML playbook step</text>
  <text x="590" y="289" text-anchor="middle" font-size="9" font-weight="700" fill="#ec4899">NEW</text>

  <!-- StepPluginProcessor box -->
  <rect x="500" y="320" width="180" height="50" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" filter="url(#shadow)"/>
  <text x="590" y="342" text-anchor="middle" font-size="10" font-weight="500" fill="#475569">StepPluginProcessor</text>
  <text x="590" y="358" text-anchor="middle" font-size="9" fill="#94a3b8">JSON Schema + Action</text>

  <!-- Arrows: APT → outputs -->
  <line x1="430" y1="185" x2="496" y2="45" stroke="#22c55e" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="430" y1="195" x2="496" y2="115" stroke="#f59e0b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="430" y1="200" x2="496" y2="185" stroke="#8b5cf6" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="430" y1="210" x2="496" y2="260" stroke="#ec4899" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow: Plugin → StepPluginProcessor -->
  <line x1="590" y1="300" x2="590" y2="316" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="615" y="313" font-size="8" fill="#94a3b8">Round 2</text>

  <!-- Labels -->
  <text x="140" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Source</text>
  <text x="360" y="148" text-anchor="middle" font-size="10" font-weight="600" fill="#3b82f6">APT Round 1</text>
  <text x="590" y="10" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Generated Outputs</text>
</svg>
