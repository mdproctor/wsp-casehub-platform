<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="ar2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#64748b" stroke-width="1.5"/>
    </marker>
  </defs>

  <rect width="700" height="280" rx="8" fill="#fafafa" stroke="#e2e8f0"/>
  <text x="350" y="28" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">TypedName.parse() — scalar vs domain type resolution</text>

  <!-- Input -->
  <g transform="translate(40, 55)">
    <rect width="160" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="80" y="25" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" fill="#334155">retryCount:integer</text>
  </g>

  <!-- Arrow -->
  <line x1="200" y1="75" x2="250" y2="75" stroke="#64748b" stroke-width="1.2" marker-end="url(#ar2)"/>

  <!-- Parse -->
  <g transform="translate(255, 50)">
    <rect width="140" height="50" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="70" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">TypedName</text>
    <text x="70" y="38" text-anchor="middle" font-size="11" fill="#475569">.parse(key)</text>
  </g>

  <!-- Branch: scalar -->
  <line x1="395" y1="65" x2="470" y2="65" stroke="#64748b" stroke-width="1.2" marker-end="url(#ar2)"/>
  <g transform="translate(475, 45)">
    <rect width="185" height="42" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
    <text x="92" y="17" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">scalarType = INTEGER</text>
    <text x="92" y="33" text-anchor="middle" font-size="11" fill="#475569">value parsed + validated</text>
  </g>

  <!-- Second input -->
  <g transform="translate(40, 140)">
    <rect width="200" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="100" y="25" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" fill="#334155">config:AgentSessionConfig</text>
  </g>

  <!-- Arrow -->
  <line x1="240" y1="160" x2="250" y2="160" stroke="#64748b" stroke-width="1.2" marker-end="url(#ar2)"/>

  <!-- Parse -->
  <g transform="translate(255, 135)">
    <rect width="140" height="50" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="70" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="#3730a3">TypedName</text>
    <text x="70" y="38" text-anchor="middle" font-size="11" fill="#475569">.parse(key)</text>
  </g>

  <!-- Branch: domain -->
  <line x1="395" y1="160" x2="470" y2="160" stroke="#64748b" stroke-width="1.2" marker-end="url(#ar2)"/>
  <g transform="translate(475, 140)">
    <rect width="185" height="42" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="92" y="17" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">scalarType = null</text>
    <text x="92" y="33" text-anchor="middle" font-size="11" fill="#475569">value stored as-is</text>
  </g>

  <!-- Third input: inferred -->
  <g transform="translate(40, 220)">
    <rect width="160" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="80" y="25" text-anchor="middle" font-size="12" font-family="'JetBrains Mono', monospace" fill="#334155">count: 42</text>
  </g>

  <!-- Arrow -->
  <line x1="200" y1="240" x2="250" y2="240" stroke="#64748b" stroke-width="1.2" marker-end="url(#ar2)"/>

  <!-- Inference -->
  <g transform="translate(255, 220)">
    <rect width="140" height="40" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
    <text x="70" y="18" text-anchor="middle" font-size="12" font-weight="600" fill="#9d174d">inferType()</text>
    <text x="70" y="33" text-anchor="middle" font-size="11" fill="#475569">from YAML value</text>
  </g>

  <!-- Arrow -->
  <line x1="395" y1="240" x2="470" y2="240" stroke="#64748b" stroke-width="1.2" marker-end="url(#ar2)"/>
  <g transform="translate(475, 222)">
    <rect width="185" height="42" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
    <text x="92" y="17" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">scalarType = INTEGER</text>
    <text x="92" y="33" text-anchor="middle" font-size="11" fill="#475569">inferred from Integer 42</text>
  </g>
</svg>
