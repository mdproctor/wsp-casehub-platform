<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220">
  <defs>
    <style>
      .box { fill: #f8f9fa; stroke: #343a40; stroke-width: 1.5; rx: 6; }
      .box-active { fill: #e3f2fd; stroke: #1565c0; stroke-width: 1.5; rx: 6; }
      .serialize { fill: #fff3e0; stroke: #e65100; stroke-width: 1.5; rx: 4; }
      .label { font-family: -apple-system, sans-serif; font-size: 12px; fill: #212529; text-anchor: middle; }
      .label-sm { font-family: monospace; font-size: 10px; fill: #6c757d; text-anchor: middle; }
      .label-ser { font-family: monospace; font-size: 9px; fill: #e65100; text-anchor: middle; }
      .arrow { stroke: #495057; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
      .arrow-ser { stroke: #e65100; stroke-width: 1; stroke-dasharray: 4,3; fill: none; }
      .title { font-family: -apple-system, sans-serif; font-size: 14px; font-weight: 600; fill: #212529; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#495057"/>
    </marker>
  </defs>

  <text x="360" y="24" class="title" text-anchor="middle">Before: Materialized at Every Boundary</text>

  <!-- Step 1: Download -->
  <rect x="20" y="50" width="130" height="50" class="box-active"/>
  <text x="85" y="72" class="label">download</text>
  <text x="85" y="86" class="label-sm">String → InputStream</text>

  <!-- Serialize 1 -->
  <rect x="168" y="58" width="74" height="34" class="serialize"/>
  <text x="205" y="73" class="label-ser">serialize</text>
  <text x="205" y="84" class="label-ser">Map&lt;S,O&gt;</text>
  <line x1="150" y1="75" x2="168" y2="75" class="arrow"/>

  <!-- Step 2: Denoise -->
  <rect x="260" y="50" width="130" height="50" class="box-active"/>
  <text x="325" y="72" class="label">denoise</text>
  <text x="325" y="86" class="label-sm">InputStream → InputStream</text>
  <line x1="242" y1="75" x2="260" y2="75" class="arrow"/>

  <!-- Serialize 2 -->
  <rect x="408" y="58" width="74" height="34" class="serialize"/>
  <text x="445" y="73" class="label-ser">serialize</text>
  <text x="445" y="84" class="label-ser">Map&lt;S,O&gt;</text>
  <line x1="390" y1="75" x2="408" y2="75" class="arrow"/>

  <!-- Step 3: Transcribe -->
  <rect x="500" y="50" width="130" height="50" class="box-active"/>
  <text x="565" y="72" class="label">transcribe</text>
  <text x="565" y="86" class="label-sm">InputStream → String</text>
  <line x1="482" y1="75" x2="500" y2="75" class="arrow"/>

  <!-- Serialize 3 -->
  <rect x="648" y="58" width="52" height="34" class="serialize"/>
  <text x="674" y="78" class="label-ser">Map</text>
  <line x1="630" y1="75" x2="648" y2="75" class="arrow"/>

  <!-- Problem annotation -->
  <text x="360" y="140" class="label" fill="#e65100">Full audio payload materializes at every orange box.</text>
  <text x="360" y="156" class="label" fill="#e65100">3 serialization boundaries for a 3-step pipeline.</text>

  <!-- Cost boxes -->
  <rect x="120" y="170" width="200" height="30" rx="4" fill="#ffebee" stroke="#c62828"/>
  <text x="220" y="190" class="label" fill="#c62828">Memory: 3× payload copies</text>
  <rect x="400" y="170" width="200" height="30" rx="4" fill="#ffebee" stroke="#c62828"/>
  <text x="500" y="190" class="label" fill="#c62828">Latency: serialize + deserialize</text>
</svg>
