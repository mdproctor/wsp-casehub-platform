<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- SPI Box -->
  <rect x="30" y="40" width="200" height="240" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="130" y="30" text-anchor="middle" font-weight="bold" fill="#1e293b" font-size="14">SPI Interface</text>

  <text x="50" y="70" fill="#6366f1" font-size="11" font-family="monospace">@McpDomain("pools")</text>
  <text x="50" y="88" fill="#059669" font-size="11" font-family="monospace">@Authenticated</text>
  <text x="50" y="106" fill="#334155" font-size="11" font-family="monospace">interface PoolApi {</text>

  <rect x="55" y="120" width="160" height="50" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="65" y="138" fill="#334155" font-size="10" font-family="monospace">@PlatformQuery</text>
  <text x="65" y="154" fill="#334155" font-size="10" font-family="monospace">listPools()</text>

  <rect x="55" y="185" width="160" height="65" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="65" y="203" fill="#334155" font-size="10" font-family="monospace">@PlatformMutation</text>
  <text x="65" y="219" fill="#059669" font-size="10" font-family="monospace">@RolesAllowed("admin")</text>
  <text x="65" y="235" fill="#334155" font-size="10" font-family="monospace">deletePools()</text>

  <text x="130" y="270" text-anchor="middle" fill="#334155" font-size="10" font-family="monospace">}</text>

  <!-- Arrow -->
  <line x1="248" y1="160" x2="340" y2="160" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="294" y="150" text-anchor="middle" fill="#64748b" font-size="10">APT generates</text>

  <!-- Generated REST Box -->
  <rect x="355" y="40" width="340" height="240" rx="8" fill="#fff7ed" stroke="#334155" stroke-width="1.5"/>
  <text x="525" y="30" text-anchor="middle" font-weight="bold" fill="#1e293b" font-size="14">Generated REST Resource</text>

  <text x="375" y="70" fill="#6366f1" font-size="11" font-family="monospace">@Path("/api/pools")</text>
  <text x="375" y="88" fill="#94a3b8" font-size="11" font-family="monospace" text-decoration="line-through">// @Authenticated  ← MISSING</text>
  <text x="375" y="106" fill="#334155" font-size="11" font-family="monospace">class PoolsResource {</text>

  <rect x="380" y="120" width="300" height="50" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="390" y="138" fill="#334155" font-size="10" font-family="monospace">@GET listPools()</text>
  <text x="390" y="154" fill="#dc2626" font-size="10" font-weight="bold">⚠ No authentication required</text>

  <rect x="380" y="185" width="300" height="65" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="390" y="203" fill="#059669" font-size="10" font-family="monospace">@RolesAllowed("admin") ✓</text>
  <text x="390" y="219" fill="#334155" font-size="10" font-family="monospace">@POST deletePools()</text>
  <text x="390" y="235" fill="#334155" font-size="10">Method-level propagated correctly</text>

  <text x="525" y="270" text-anchor="middle" fill="#334155" font-size="10" font-family="monospace">}</text>

  <!-- Caption -->
  <text x="360" y="310" fill="#dc2626" font-size="12" font-weight="bold">The gap: class-level annotations were silently dropped</text>
</svg>
