<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#475569"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#16a34a"/>
    </marker>
  </defs>

  <style>
    .title { font-size: 15px; font-weight: 600; fill: #1e293b; }
    .box-label { font-size: 12px; font-weight: 500; fill: #1e293b; }
    .box-detail { font-size: 10px; fill: #64748b; }
    .annotation { font-size: 10px; fill: #dc2626; font-style: italic; }
    .annotation-ok { font-size: 10px; fill: #16a34a; font-style: italic; }
    .section-label { font-size: 11px; font-weight: 600; fill: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
  </style>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" class="title">Expression Engine Default Resolution</text>

  <!-- Section labels -->
  <text x="30" y="60" class="section-label">Before (silent null)</text>
  <text x="30" y="220" class="section-label">After (platform defaults + startup validation)</text>

  <!-- BEFORE section -->
  <rect x="40" y="75" width="130" height="50" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="105" y="97" text-anchor="middle" class="box-label">ExpressionContext</text>
  <text x="105" y="112" text-anchor="middle" class="box-detail">CONDITION</text>

  <line x1="170" y1="100" x2="230" y2="100" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="200" y="92" text-anchor="middle" class="box-detail">resolveDefault()</text>

  <rect x="232" y="75" width="130" height="50" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="297" y="97" text-anchor="middle" class="box-label">EnumMap lookup</text>
  <text x="297" y="112" text-anchor="middle" class="box-detail">empty → null</text>

  <line x1="362" y1="100" x2="422" y2="100" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="392" y="92" text-anchor="middle" class="box-detail" fill="#dc2626">null</text>

  <rect x="424" y="75" width="140" height="50" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="494" y="97" text-anchor="middle" class="box-label">Caller fallback</text>
  <text x="494" y="112" text-anchor="middle" class="box-detail">skip condition entirely</text>

  <line x1="564" y1="100" x2="624" y2="100" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <rect x="626" y="75" width="70" height="50" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="661" y="97" text-anchor="middle" class="box-label" fill="#dc2626">Silent</text>
  <text x="661" y="112" text-anchor="middle" class="box-label" fill="#dc2626">degradation</text>

  <text x="494" y="145" text-anchor="middle" class="annotation">Conditions ignored — type-match only</text>
  <text x="494" y="158" text-anchor="middle" class="annotation">No error, no warning in production</text>

  <!-- AFTER section -->
  <rect x="40" y="235" width="130" height="50" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="105" y="257" text-anchor="middle" class="box-label">ExpressionContext</text>
  <text x="105" y="272" text-anchor="middle" class="box-detail">CONDITION</text>

  <line x1="170" y1="260" x2="230" y2="260" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="200" y="252" text-anchor="middle" class="box-detail">resolveDefault()</text>

  <rect x="232" y="235" width="130" height="50" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="297" y="257" text-anchor="middle" class="box-label">EnumMap lookup</text>
  <text x="297" y="272" text-anchor="middle" class="box-detail">CONDITION → "mvel"</text>

  <line x1="362" y1="260" x2="422" y2="260" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="392" y="252" text-anchor="middle" class="box-detail" fill="#16a34a">"mvel"</text>

  <rect x="424" y="235" width="140" height="50" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="494" y="257" text-anchor="middle" class="box-label">compile()</text>
  <text x="494" y="272" text-anchor="middle" class="box-detail">MVEL expression compiled</text>

  <line x1="564" y1="260" x2="624" y2="260" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <rect x="626" y="235" width="70" height="50" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="661" y="257" text-anchor="middle" class="box-label" fill="#16a34a">Condition</text>
  <text x="661" y="272" text-anchor="middle" class="box-label" fill="#16a34a">evaluated</text>

  <!-- Default mapping table -->
  <rect x="60" y="310" width="600" height="75" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="360" y="330" text-anchor="middle" class="box-label">Platform Defaults (registered + validated at startup)</text>
  <line x1="60" y1="338" x2="660" y2="338" stroke="#e2e8f0" stroke-width="1"/>
  <text x="175" y="355" text-anchor="middle" class="box-detail">CONDITION → mvel</text>
  <text x="310" y="355" text-anchor="middle" class="box-detail">TRANSFORM → jq</text>
  <text x="445" y="355" text-anchor="middle" class="box-detail">FILTER → jq</text>
  <text x="565" y="355" text-anchor="middle" class="box-detail">PARAMETER → mvel</text>
  <text x="360" y="375" text-anchor="middle" class="annotation-ok">Startup validation: missing default → IllegalStateException</text>

  <!-- Validation gate -->
  <rect x="140" y="405" width="440" height="55" rx="6" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="360" y="425" text-anchor="middle" class="box-label">Startup Validation Loop</text>
  <text x="360" y="442" text-anchor="middle" class="box-detail">for (ExpressionContext ctx : values()) — resolveDefault(ctx) ≠ null</text>
  <text x="360" y="455" text-anchor="middle" class="box-detail" fill="#b45309">Regression → startup crash, not runtime null</text>
</svg>
