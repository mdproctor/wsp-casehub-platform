<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 240" font-family="system-ui, -apple-system, sans-serif" font-size="12">

  <text x="310" y="18" text-anchor="middle" font-size="14" font-weight="600" fill="#333">Context clearing policies</text>

  <!-- every-call -->
  <text x="20" y="50" font-weight="600" fill="#1e40af">every-call</text>
  <rect x="120" y="38" width="50" height="22" rx="3" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="145" y="53" text-anchor="middle" font-size="10">Q1</text>
  <text x="180" y="53" text-anchor="middle" font-size="14" fill="#dc2626">✕</text>
  <rect x="195" y="38" width="50" height="22" rx="3" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="220" y="53" text-anchor="middle" font-size="10">Q2</text>
  <text x="255" y="53" text-anchor="middle" font-size="14" fill="#dc2626">✕</text>
  <rect x="270" y="38" width="50" height="22" rx="3" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="295" y="53" text-anchor="middle" font-size="10">Q3</text>
  <text x="340" y="53" font-size="11" fill="#888">Clear between every turn. Stateless.</text>

  <!-- turn-count -->
  <text x="20" y="100" font-weight="600" fill="#1e40af">turn-count</text>
  <text x="20" y="114" font-size="10" fill="#888">(turns=3)</text>
  <rect x="120" y="88" width="50" height="22" rx="3" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="145" y="103" text-anchor="middle" font-size="10">Q1</text>
  <rect x="175" y="88" width="50" height="22" rx="3" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="200" y="103" text-anchor="middle" font-size="10">Q2</text>
  <rect x="230" y="88" width="50" height="22" rx="3" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="255" y="103" text-anchor="middle" font-size="10">Q3</text>
  <text x="290" y="103" text-anchor="middle" font-size="14" fill="#dc2626">✕</text>
  <rect x="305" y="88" width="50" height="22" rx="3" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="330" y="103" text-anchor="middle" font-size="10">Q4</text>
  <text x="375" y="103" font-size="11" fill="#888">Clear every N turns. Bounded context.</text>

  <!-- size-aware -->
  <text x="20" y="155" font-weight="600" fill="#1e40af">size-aware</text>
  <rect x="120" y="138" width="30" height="22" rx="3" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="135" y="153" text-anchor="middle" font-size="9">Q1</text>
  <rect x="155" y="138" width="60" height="22" rx="3" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="185" y="153" text-anchor="middle" font-size="9">Q2</text>
  <rect x="220" y="138" width="100" height="22" rx="3" fill="#fecaca" stroke="#f87171"/>
  <text x="270" y="153" text-anchor="middle" font-size="9">Q3 (big)</text>
  <text x="330" y="153" text-anchor="middle" font-size="14" fill="#dc2626">✕</text>
  <rect x="345" y="138" width="30" height="22" rx="3" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="360" y="153" text-anchor="middle" font-size="9">Q4</text>
  <text x="400" y="153" font-size="11" fill="#888">Clear when tokens exceed threshold.</text>

  <!-- explicit -->
  <text x="20" y="205" font-weight="600" fill="#1e40af">explicit</text>
  <rect x="120" y="188" width="50" height="22" rx="3" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="145" y="203" text-anchor="middle" font-size="10">Q1</text>
  <rect x="175" y="188" width="50" height="22" rx="3" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="200" y="203" text-anchor="middle" font-size="10">Q2</text>
  <rect x="230" y="188" width="50" height="22" rx="3" fill="#bbf7d0" stroke="#4ade80"/>
  <text x="255" y="203" text-anchor="middle" font-size="9" fill="#15803d">clear</text>
  <rect x="285" y="188" width="50" height="22" rx="3" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="310" y="203" text-anchor="middle" font-size="10">Q3</text>
  <text x="355" y="203" font-size="11" fill="#888">Application controls when to clear.</text>

  <!-- ✕ = context cleared -->
  <text x="310" y="235" text-anchor="middle" font-size="11" fill="#888"><tspan fill="#dc2626">✕</tspan> = context cleared</text>
</svg>
