<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <!-- Background -->
  <rect width="720" height="400" fill="#fafafa" rx="8"/>

  <!-- agent-api box -->
  <rect x="220" y="20" width="280" height="90" rx="6" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="360" y="48" text-anchor="middle" font-weight="bold" font-size="14" fill="#1a73e8">agent-api</text>
  <text x="360" y="68" text-anchor="middle" fill="#555" font-size="11">AgentResolver · AgentChatApi</text>
  <text x="360" y="84" text-anchor="middle" fill="#555" font-size="11">ResolvedAgent · AgentDescriptor</text>
  <text x="360" y="100" text-anchor="middle" fill="#888" font-size="10">zero-framework · pure Java</text>

  <!-- Arrow from agent-api to agent-rest-core -->
  <line x1="360" y1="110" x2="360" y2="145" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- agent-rest-core box -->
  <rect x="220" y="145" width="280" height="70" rx="6" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="360" y="172" text-anchor="middle" font-weight="bold" font-size="14" fill="#e37400">agent-rest-core</text>
  <text x="360" y="192" text-anchor="middle" fill="#555" font-size="11">AgentChatService implements AgentChatApi</text>
  <text x="360" y="206" text-anchor="middle" fill="#888" font-size="10">framework-neutral POJO</text>

  <!-- Arrow from agent-rest-core to agent-rest -->
  <line x1="300" y1="215" x2="180" y2="280" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow from agent-rest-core to agent-rest-spring -->
  <line x1="420" y1="215" x2="540" y2="280" stroke="#999" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- agent-rest box (Quarkus) -->
  <rect x="40" y="280" width="280" height="90" rx="6" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="180" y="308" text-anchor="middle" font-weight="bold" font-size="14" fill="#0d652d">agent-rest</text>
  <text x="180" y="328" text-anchor="middle" fill="#555" font-size="11">AgentRestBeans · ExceptionMappers</text>
  <text x="180" y="344" text-anchor="middle" fill="#555" font-size="11">APT → AgentChatResource</text>
  <text x="180" y="360" text-anchor="middle" fill="#888" font-size="10">Quarkus CDI · graphql-generator</text>

  <!-- agent-rest-spring box -->
  <rect x="400" y="280" width="280" height="90" rx="6" fill="#fce8e6" stroke="#ea4335" stroke-width="1.5"/>
  <text x="540" y="308" text-anchor="middle" font-weight="bold" font-size="14" fill="#c5221f">agent-rest-spring</text>
  <text x="540" y="328" text-anchor="middle" fill="#555" font-size="11">AgentChatRestController</text>
  <text x="540" y="344" text-anchor="middle" fill="#555" font-size="11">AgentRestAutoConfiguration</text>
  <text x="540" y="360" text-anchor="middle" fill="#888" font-size="10">Spring Boot · @AutoConfiguration</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#999"/>
    </marker>
  </defs>
</svg>
