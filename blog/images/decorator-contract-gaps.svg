<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Decorator Wrapping Order — Outermost to Innermost</text>
  <text x="360" y="46" text-anchor="middle" font-size="11" fill="#94a3b8">Each layer wraps the next. Bugs compound across boundaries.</text>

  <!-- Decorator boxes — outermost first -->
  <g transform="translate(40, 65)">
    <!-- when -->
    <rect x="0" y="0" width="140" height="42" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="70" y="18" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">when</text>
    <text x="70" y="32" text-anchor="middle" font-size="9" fill="#166534">P39-6: returned empty success</text>

    <!-- forEach -->
    <rect x="160" y="0" width="140" height="42" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="230" y="18" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">forEach</text>
    <text x="230" y="32" text-anchor="middle" font-size="9" fill="#166534">P39-3: no fail-fast</text>

    <!-- background -->
    <rect x="320" y="0" width="140" height="42" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="390" y="18" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">background</text>
    <text x="390" y="32" text-anchor="middle" font-size="9" fill="#1e40af">P39-5: contract documented</text>

    <!-- cancel -->
    <rect x="480" y="0" width="140" height="42" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="550" y="18" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">cancel</text>
    <text x="550" y="32" text-anchor="middle" font-size="9" fill="#991b1b">P39-4: swallowed interrupts</text>
  </g>

  <!-- Second row -->
  <g transform="translate(40, 125)">
    <!-- loop -->
    <rect x="0" y="0" width="140" height="42" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="70" y="18" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">loop</text>
    <text x="70" y="32" text-anchor="middle" font-size="9" fill="#991b1b">P39-1: silent exhaustion</text>

    <!-- on-error -->
    <rect x="160" y="0" width="140" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="230" y="18" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">on-error</text>
    <text x="230" y="32" text-anchor="middle" font-size="9" fill="#94a3b8">no issue found</text>

    <!-- timeout -->
    <rect x="320" y="0" width="140" height="42" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="390" y="18" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">timeout</text>
    <text x="390" y="32" text-anchor="middle" font-size="9" fill="#991b1b">P38: blocked forever</text>

    <!-- retry -->
    <rect x="480" y="0" width="140" height="42" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="550" y="18" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">retry</text>
    <text x="550" y="32" text-anchor="middle" font-size="9" fill="#991b1b">P39-2: retried everything</text>
  </g>

  <!-- Arrow connecting rows -->
  <line x1="360" y1="112" x2="360" y2="125" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- The compound bugs section -->
  <rect x="40" y="195" width="640" height="210" rx="8" fill="#fffbeb" stroke="#fbbf24" stroke-width="1"/>
  <text x="60" y="218" font-size="13" font-weight="600" fill="#92400e">Why these compound</text>

  <!-- Compound example 1 -->
  <text x="60" y="244" font-size="11" fill="#78350f" font-weight="600">timeout + cancel</text>
  <text x="60" y="260" font-size="10.5" fill="#92400e">Timeout fires, interrupts the step. Cancel's finally block clears the interrupt.</text>
  <text x="60" y="275" font-size="10.5" fill="#92400e">The step resumes as if nothing happened. Timeout thinks it succeeded.</text>

  <!-- Compound example 2 -->
  <text x="60" y="302" font-size="11" fill="#78350f" font-weight="600">retry + on-filter + null category</text>
  <text x="60" y="318" font-size="10.5" fill="#92400e">Validation error (null category) passes through the on-filter check.</text>
  <text x="60" y="333" font-size="10.5" fill="#92400e">Retry runs the same invalid input again. And again. All attempts wasted.</text>

  <!-- Compound example 3 -->
  <text x="60" y="360" font-size="11" fill="#78350f" font-weight="600">loop + until + silent cap</text>
  <text x="60" y="376" font-size="10.5" fill="#92400e">Until condition never met; loop hits 1,000 iterations and returns success.</text>
  <text x="60" y="391" font-size="10.5" fill="#92400e">Downstream steps proceed on data that was never correctly processed.</text>

  <!-- Legend -->
  <g transform="translate(40, 410)">
    <rect x="0" y="-4" width="12" height="12" rx="2" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="18" y="6" font-size="10" fill="#64748b">Bug fixed</text>
    <rect x="100" y="-4" width="12" height="12" rx="2" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="118" y="6" font-size="10" fill="#64748b">Semantic fix</text>
    <rect x="210" y="-4" width="12" height="12" rx="2" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
    <text x="228" y="6" font-size="10" fill="#64748b">Contract documented</text>
    <rect x="360" y="-4" width="12" height="12" rx="2" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="378" y="6" font-size="10" fill="#64748b">No issue</text>
  </g>
</svg>