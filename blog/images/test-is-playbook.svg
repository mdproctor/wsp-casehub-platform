<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="system-ui, -apple-system, sans-serif">
  <style>
    .box { rx: 8; ry: 8; }
    .label { font-size: 13px; fill: #374151; font-weight: 600; }
    .sublabel { font-size: 11px; fill: #6b7280; }
    .arrow { stroke: #9ca3af; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    .strike { stroke: #ef4444; stroke-width: 2; }
    .highlight { fill: #dbeafe; stroke: #3b82f6; stroke-width: 1.5; }
    .dim { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 1; opacity: 0.6; }
    .new { fill: #dcfce7; stroke: #22c55e; stroke-width: 1.5; }
    .section-label { font-size: 15px; fill: #111827; font-weight: 700; }
    .vs-label { font-size: 14px; fill: #9ca3af; font-weight: 700; font-style: italic; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- Left side: Before -->
  <text x="180" y="30" class="section-label" text-anchor="middle">Before</text>

  <!-- Java test file -->
  <rect x="30" y="50" width="140" height="60" class="box dim"/>
  <text x="100" y="75" class="label" text-anchor="middle">Java Test</text>
  <text x="100" y="92" class="sublabel" text-anchor="middle">520 lines boilerplate</text>

  <!-- Arrow to corpus -->
  <path d="M 170 80 L 200 80" class="arrow"/>

  <!-- Hand-coded corpus -->
  <rect x="210" y="50" width="140" height="60" class="box dim"/>
  <text x="280" y="75" class="label" text-anchor="middle">Hand-coded</text>
  <text x="280" y="92" class="sublabel" text-anchor="middle">CorpusBackend</text>

  <!-- Arrow down to playbook -->
  <rect x="110" y="140" width="140" height="50" class="box dim"/>
  <text x="180" y="162" class="label" text-anchor="middle">Playbook</text>
  <text x="180" y="178" class="sublabel" text-anchor="middle">.yaml (tested)</text>

  <path d="M 100 110 L 100 140 L 110 155" class="arrow"/>
  <path d="M 280 110 L 280 140 L 250 155" class="arrow"/>

  <!-- Simulation layer -->
  <rect x="30" y="220" width="320" height="50" class="box dim"/>
  <text x="190" y="245" class="label" text-anchor="middle">simulation.yaml (separate system)</text>
  <text x="190" y="260" class="sublabel" text-anchor="middle">strategy + corpus — disconnected from tests</text>

  <!-- Strike through connecting line -->
  <line x1="20" y1="44" x2="360" y2="280" class="strike" stroke-dasharray="6,4" opacity="0.4"/>

  <!-- VS divider -->
  <text x="400" y="170" class="vs-label" text-anchor="middle">vs</text>
  <line x1="400" y1="40" x2="400" y2="300" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Right side: After -->
  <text x="610" y="30" class="section-label" text-anchor="middle">After</text>

  <!-- .test.yaml file -->
  <rect x="460" y="50" width="300" height="240" class="box new"/>
  <text x="610" y="78" class="label" text-anchor="middle">.test.yaml</text>
  <text x="610" y="96" class="sublabel" text-anchor="middle">~25 lines — IS a playbook</text>

  <!-- simulate block -->
  <rect x="480" y="110" width="260" height="50" class="box highlight"/>
  <text x="610" y="132" class="label" text-anchor="middle">simulate:</text>
  <text x="610" y="148" class="sublabel" text-anchor="middle">inline corpus + strategy config</text>

  <!-- steps block -->
  <rect x="480" y="170" width="260" height="50" class="box highlight"/>
  <text x="610" y="192" class="label" text-anchor="middle">steps:</text>
  <text x="610" y="208" class="sublabel" text-anchor="middle">real playbook steps + assertions</text>

  <!-- assertThat block -->
  <rect x="480" y="230" width="260" height="40" class="box highlight"/>
  <text x="610" y="252" class="label" text-anchor="middle">assertThat: ${result}</text>
  <text x="610" y="265" class="sublabel" text-anchor="middle">behavioural matchers</text>

  <!-- Bottom labels -->
  <text x="190" y="330" class="sublabel" text-anchor="middle">3 disconnected systems</text>
  <text x="610" y="330" class="sublabel" text-anchor="middle">1 self-contained file</text>
  <text x="190" y="348" class="sublabel" text-anchor="middle">test ≠ playbook ≠ simulation</text>
  <text x="610" y="348" class="sublabel" text-anchor="middle">test = playbook = tutorial</text>
</svg>
