<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="420" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#222">Two-Mode Quality Harness</text>

  <!-- LLM Mode (left) -->
  <rect x="30" y="55" width="300" height="340" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="180" y="78" text-anchor="middle" font-size="12" font-weight="600" fill="#e65100">LLM Mode (Developer Local)</text>

  <rect x="60" y="95" width="240" height="40" rx="4" fill="#fff" stroke="#bbb"/>
  <text x="180" y="120" text-anchor="middle" fill="#333">LlmVariationSeeder</text>

  <line x1="180" y1="135" x2="180" y2="155" stroke="#555" marker-end="url(#arrow)"/>

  <rect x="60" y="160" width="240" height="40" rx="4" fill="#fff" stroke="#bbb"/>
  <text x="180" y="185" text-anchor="middle" fill="#333">Generate N variations</text>

  <line x1="180" y1="200" x2="180" y2="220" stroke="#555" marker-end="url(#arrow)"/>

  <rect x="60" y="225" width="240" height="40" rx="4" fill="#e8f5e9" stroke="#2e7d32"/>
  <text x="180" y="250" text-anchor="middle" fill="#2e7d32" font-weight="500">VariationFixtureWriter</text>

  <line x1="180" y1="265" x2="180" y2="285" stroke="#555" marker-end="url(#arrow)"/>

  <rect x="60" y="290" width="240" height="40" rx="4" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="180" y="315" text-anchor="middle" fill="#1565c0" font-weight="500">.variations.yaml</text>

  <!-- CI Mode (right) -->
  <rect x="390" y="55" width="300" height="340" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="540" y="78" text-anchor="middle" font-size="12" font-weight="600" fill="#2e7d32">Corpus Mode (CI)</text>

  <rect x="420" y="95" width="240" height="40" rx="4" fill="#e3f2fd" stroke="#1565c0"/>
  <text x="540" y="120" text-anchor="middle" fill="#1565c0" font-weight="500">.variations.yaml</text>

  <line x1="540" y1="135" x2="540" y2="155" stroke="#555" marker-end="url(#arrow)"/>

  <rect x="420" y="160" width="240" height="40" rx="4" fill="#fff" stroke="#bbb"/>
  <text x="540" y="185" text-anchor="middle" fill="#333">VariationFixtureLoader</text>

  <line x1="540" y1="200" x2="540" y2="220" stroke="#555" marker-end="url(#arrow)"/>

  <!-- Shared harness -->
  <rect x="345" y="225" width="320" height="40" rx="4" fill="#fff3e0" stroke="#e65100"/>
  <text x="505" y="250" text-anchor="middle" fill="#e65100" font-weight="600">CorpusQualityHarness.evaluate()</text>

  <!-- Arrow from LLM .yaml to shared harness -->
  <line x1="300" y1="310" x2="345" y2="260" stroke="#555" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <line x1="505" y1="265" x2="505" y2="285" stroke="#555" marker-end="url(#arrow)"/>

  <!-- Report -->
  <rect x="390" y="290" width="230" height="90" rx="4" fill="#fce4ec" stroke="#c62828"/>
  <text x="505" y="313" text-anchor="middle" fill="#c62828" font-weight="500">CorpusQualityReport</text>
  <text x="505" y="333" text-anchor="middle" font-size="11" fill="#666">matchRate() per template</text>
  <text x="505" y="350" text-anchor="middle" font-size="11" fill="#666">fieldMismatchCount</text>
  <text x="505" y="367" text-anchor="middle" font-size="11" fill="#666">cross-namespace collisions</text>
</svg>
