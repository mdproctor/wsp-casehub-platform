<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" font-family="Inter, system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="390" y="28" text-anchor="middle" font-size="16" font-weight="600" fill="#1e293b">Two Philosophies of Acknowledgement</text>

  <!-- Qhorus side -->
  <rect x="20" y="50" width="350" height="230" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="195" y="75" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">Qhorus — Protocol Obligation</text>

  <rect x="50" y="95" width="120" height="32" rx="5" fill="#fff" stroke="#94a3b8"/>
  <text x="110" y="115" text-anchor="middle" fill="#334155" font-size="12">COMMAND</text>

  <line x1="170" y1="111" x2="200" y2="111" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="205" y="95" width="130" height="32" rx="5" fill="#fff" stroke="#94a3b8"/>
  <text x="270" y="115" text-anchor="middle" fill="#334155" font-size="12">ACKNOWLEDGED</text>

  <line x1="270" y1="127" x2="270" y2="148" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="205" y="152" width="130" height="32" rx="5" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="270" y="172" text-anchor="middle" fill="#1e40af" font-size="12" font-weight="500">FULFILLED</text>

  <text x="195" y="210" text-anchor="middle" fill="#64748b" font-size="11" font-style="italic">Enforced lifecycle.</text>
  <text x="195" y="226" text-anchor="middle" fill="#64748b" font-size="11" font-style="italic">System tracks whether</text>
  <text x="195" y="242" text-anchor="middle" fill="#64748b" font-size="11" font-style="italic">the obligation was met.</text>
  <text x="195" y="264" text-anchor="middle" fill="#1e40af" font-size="12" font-weight="600">"Did they act on it?"</text>

  <!-- Notifications side -->
  <rect x="410" y="50" width="350" height="230" rx="8" fill="#fdf4ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="585" y="75" text-anchor="middle" font-size="14" font-weight="600" fill="#7e22ce">Notifications — Optional Response</text>

  <rect x="440" y="95" width="120" height="32" rx="5" fill="#fff" stroke="#94a3b8"/>
  <text x="500" y="115" text-anchor="middle" fill="#334155" font-size="12">NOTIFICATION</text>

  <line x1="560" y1="111" x2="590" y2="111" stroke="#475569" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="595" y="95" width="130" height="32" rx="5" fill="#fff" stroke="#94a3b8"/>
  <text x="660" y="115" text-anchor="middle" fill="#334155" font-size="12">OPENED / CLICKED</text>

  <line x1="660" y1="127" x2="660" y2="148" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arr)"/>

  <rect x="595" y="152" width="130" height="32" rx="5" fill="#f5f3ff" stroke="#a78bfa"/>
  <text x="660" y="172" text-anchor="middle" fill="#7e22ce" font-size="12" font-weight="500">REPLIED (maybe)</text>

  <text x="585" y="210" text-anchor="middle" fill="#64748b" font-size="11" font-style="italic">No enforcement.</text>
  <text x="585" y="226" text-anchor="middle" fill="#64748b" font-size="11" font-style="italic">Response captured if given.</text>
  <text x="585" y="242" text-anchor="middle" fill="#64748b" font-size="11" font-style="italic">Nothing happens if not.</text>
  <text x="585" y="264" text-anchor="middle" fill="#7e22ce" font-size="12" font-weight="600">"Here's what happened."</text>
</svg>
