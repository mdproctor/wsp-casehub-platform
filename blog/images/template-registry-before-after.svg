<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" fill="#fafafa" rx="8"/>

  <!-- BEFORE section -->
  <text x="210" y="30" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">Before</text>
  <rect x="20" y="42" width="380" height="460" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="6" stroke-dasharray="6,3"/>

  <!-- Protocol Stack -->
  <text x="130" y="68" font-size="11" fill="#64748b" font-weight="600">Protocol Stack</text>
  <rect x="40" y="80" width="170" height="36" fill="#fff" stroke="#94a3b8" rx="4"/>
  <text x="125" y="103" text-anchor="middle" fill="#334155" font-size="12">TemplateExtractor</text>
  <text x="125" y="115" text-anchor="middle" fill="#94a3b8" font-size="9">yaml-core</text>

  <line x1="125" y1="116" x2="125" y2="132" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="40" y="134" width="170" height="36" fill="#fff" stroke="#94a3b8" rx="4"/>
  <text x="125" y="157" text-anchor="middle" fill="#334155" font-size="12">TemplateRegistry</text>
  <text x="125" y="169" text-anchor="middle" fill="#94a3b8" font-size="9">yaml-core</text>

  <line x1="125" y1="170" x2="125" y2="186" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="40" y="188" width="170" height="36" fill="#fff" stroke="#94a3b8" rx="4"/>
  <text x="125" y="211" text-anchor="middle" fill="#334155" font-size="12">ProtocolEvaluator</text>
  <text x="125" y="223" text-anchor="middle" fill="#94a3b8" font-size="9">coordination-core</text>

  <line x1="125" y1="224" x2="125" y2="240" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="40" y="242" width="170" height="36" fill="#fff" stroke="#94a3b8" rx="4"/>
  <text x="125" y="265" text-anchor="middle" fill="#334155" font-size="12">TemplateMatchingFilter</text>
  <text x="125" y="277" text-anchor="middle" fill="#94a3b8" font-size="9">yaml-step-runtime</text>

  <!-- NLP SPI gap -->
  <rect x="40" y="296" width="170" height="30" fill="#fef2f2" stroke="#fca5a5" rx="4" stroke-dasharray="4,2"/>
  <text x="125" y="315" text-anchor="middle" fill="#dc2626" font-size="11">NlpProtocolMatcher</text>
  <text x="215" y="315" fill="#dc2626" font-size="10">0 impls</text>

  <!-- Extraction Stack -->
  <text x="320" y="68" font-size="11" fill="#64748b" font-weight="600">Extraction Stack</text>
  <rect x="230" y="80" width="160" height="36" fill="#fff" stroke="#94a3b8" rx="4"/>
  <text x="310" y="103" text-anchor="middle" fill="#334155" font-size="12">RegexMessageMatcher</text>
  <text x="310" y="115" text-anchor="middle" fill="#94a3b8" font-size="9">message-extraction-api</text>

  <line x1="310" y1="116" x2="310" y2="132" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="230" y="134" width="160" height="36" fill="#fff" stroke="#94a3b8" rx="4"/>
  <text x="310" y="157" text-anchor="middle" fill="#334155" font-size="12">TwoTierMatcher</text>
  <text x="310" y="169" text-anchor="middle" fill="#94a3b8" font-size="9">message-extraction</text>

  <line x1="310" y1="170" x2="310" y2="186" stroke="#64748b" marker-end="url(#arrow)"/>

  <rect x="230" y="188" width="160" height="36" fill="#fff" stroke="#94a3b8" rx="4"/>
  <text x="310" y="211" text-anchor="middle" fill="#334155" font-size="12">StructuralPattern</text>
  <text x="310" y="223" text-anchor="middle" fill="#94a3b8" font-size="9">message-extraction</text>

  <!-- Duplicate marker -->
  <rect x="60" y="345" width="320" height="52" fill="#fefce8" stroke="#fbbf24" rx="4"/>
  <text x="220" y="365" text-anchor="middle" fill="#92400e" font-size="11" font-weight="600">Duplicated across both stacks:</text>
  <text x="220" y="383" text-anchor="middle" fill="#92400e" font-size="11">VariableConstraint, regex compilation, keyword caches</text>

  <!-- Per-playbook silos -->
  <rect x="60" y="410" width="320" height="38" fill="#fef2f2" stroke="#fca5a5" rx="4"/>
  <text x="220" y="428" text-anchor="middle" fill="#dc2626" font-size="11" font-weight="600">Each playbook creates its own ProtocolEvaluator</text>
  <text x="220" y="442" text-anchor="middle" fill="#dc2626" font-size="11">No cross-playbook composition</text>

  <!-- No connection line between stacks -->
  <line x1="210" y1="210" x2="230" y2="210" stroke="#fca5a5" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="220" y="236" text-anchor="middle" fill="#dc2626" font-size="9" transform="rotate(-90, 220, 236)">no link</text>

  <!-- AFTER section -->
  <text x="660" y="30" font-size="15" font-weight="bold" fill="#1e293b" text-anchor="middle">After</text>
  <rect x="480" y="42" width="400" height="460" fill="none" stroke="#3b82f6" stroke-width="1.5" rx="6"/>

  <!-- yaml-core -->
  <rect x="510" y="60" width="180" height="36" fill="#f0f9ff" stroke="#93c5fd" rx="4"/>
  <text x="600" y="83" text-anchor="middle" fill="#1e40af" font-size="12" font-weight="600">VariableConstraint</text>
  <text x="600" y="95" text-anchor="middle" fill="#60a5fa" font-size="9">yaml-core (canonical)</text>

  <line x1="600" y1="96" x2="600" y2="114" stroke="#3b82f6" marker-end="url(#arrow-blue)"/>

  <!-- template-registry-api -->
  <rect x="500" y="116" width="340" height="130" fill="#eff6ff" stroke="#3b82f6" rx="6"/>
  <text x="670" y="136" font-size="12" font-weight="bold" fill="#1e40af">template-registry-api</text>
  <text x="670" y="150" font-size="9" fill="#60a5fa">zero external deps</text>

  <text x="520" y="170" font-size="11" fill="#334155">TemplateDefinition</text>
  <text x="520" y="186" font-size="11" fill="#334155">TemplateNamespace</text>
  <text x="520" y="202" font-size="11" fill="#334155">TemplateMatch (sealed)</text>
  <text x="520" y="218" font-size="11" fill="#334155">UnifiedTemplateRegistry SPI</text>

  <text x="700" y="170" font-size="11" fill="#334155">RegexTemplateCompiler</text>
  <text x="700" y="186" font-size="11" fill="#334155">TemplateGenerator</text>
  <text x="700" y="202" font-size="11" fill="#334155">NlpTokenizer SPI</text>
  <text x="700" y="218" font-size="11" fill="#334155">InMemoryTemplateRegistry</text>

  <line x1="670" y1="246" x2="670" y2="268" stroke="#3b82f6" marker-end="url(#arrow-blue)"/>

  <!-- template-registry -->
  <rect x="500" y="270" width="340" height="110" fill="#dbeafe" stroke="#3b82f6" rx="6"/>
  <text x="670" y="290" font-size="12" font-weight="bold" fill="#1e40af">template-registry</text>
  <text x="670" y="304" font-size="9" fill="#60a5fa">L4 Extension — opt-in by classpath</text>

  <text x="520" y="324" font-size="11" fill="#334155">OpenNlpTokenizer</text>
  <text x="520" y="340" font-size="11" fill="#334155">StructuralMatcher</text>
  <text x="520" y="356" font-size="11" fill="#334155">LemmatisedKeywordFilter</text>

  <text x="700" y="324" font-size="11" fill="#334155">NlpTemplateRegistry</text>
  <text x="700" y="340" font-size="11" fill="#334155">TemplateSchemaEndpoint</text>
  <text x="700" y="356" font-size="11" fill="#334155">@McpDomain</text>

  <!-- Two-tier matching -->
  <rect x="510" y="400" width="320" height="86" fill="#f0fdf4" stroke="#86efac" rx="4"/>
  <text x="670" y="420" text-anchor="middle" fill="#166534" font-size="11" font-weight="600">Two-tier matching pipeline</text>

  <rect x="525" y="430" width="130" height="22" fill="#fff" stroke="#86efac" rx="3"/>
  <text x="590" y="445" text-anchor="middle" fill="#166534" font-size="10">Tier 1: Regex (1.0)</text>

  <text x="665" y="445" fill="#64748b" font-size="10">→</text>

  <rect x="680" y="430" width="136" height="22" fill="#fff" stroke="#86efac" rx="3"/>
  <text x="748" y="445" text-anchor="middle" fill="#166534" font-size="10">Tier 2: NLP (scored)</text>

  <text x="670" y="475" text-anchor="middle" fill="#166534" font-size="10">Namespaced, shared, immutable-snapshot concurrency</text>
</svg>
