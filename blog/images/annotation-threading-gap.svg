<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Annotation Threading Through Step Types</text>

  <!-- Parent resolve() loop -->
  <rect x="240" y="48" width="240" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="360" y="71" text-anchor="middle" font-size="13" font-weight="500" fill="#334155">resolve() — annotation attachment</text>

  <!-- Arrow down -->
  <line x1="360" y1="84" x2="360" y2="110" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- resolveOne dispatch -->
  <rect x="240" y="112" width="240" height="36" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="360" y="135" text-anchor="middle" font-size="13" font-weight="500" fill="#334155">resolveOne() — type dispatch</text>

  <!-- Fan out to step types -->
  <!-- Left group: threaded (green) -->
  <line x1="300" y1="148" x2="100" y2="185" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="330" y1="148" x2="240" y2="185" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="148" x2="360" y2="185" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Right group: gap (red) -->
  <line x1="390" y1="148" x2="490" y2="185" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <line x1="420" y1="148" x2="620" y2="185" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <!-- Threaded step types -->
  <rect x="30" y="188" width="140" height="56" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="100" y="210" text-anchor="middle" font-size="12" font-weight="500" fill="#166534">block / parallel</text>
  <text x="100" y="228" text-anchor="middle" font-size="11" fill="#166534">annotations + prefix</text>

  <rect x="180" y="188" width="120" height="56" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="240" y="210" text-anchor="middle" font-size="12" font-weight="500" fill="#166534">if / else</text>
  <text x="240" y="228" text-anchor="middle" font-size="11" fill="#166534">prefix + offset</text>

  <rect x="310" y="188" width="120" height="56" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="370" y="210" text-anchor="middle" font-size="12" font-weight="500" fill="#166534">try / catch</text>
  <text x="370" y="228" text-anchor="middle" font-size="11" fill="#166534">prefix + offset</text>

  <!-- Gap step types -->
  <rect x="440" y="188" width="100" height="56" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="490" y="210" text-anchor="middle" font-size="12" font-weight="500" fill="#991b1b">match</text>
  <text x="490" y="228" text-anchor="middle" font-size="11" fill="#991b1b">empty()</text>

  <rect x="570" y="188" width="100" height="56" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="620" y="210" text-anchor="middle" font-size="12" font-weight="500" fill="#991b1b">select</text>
  <text x="620" y="228" text-anchor="middle" font-size="11" fill="#991b1b">empty()</text>

  <!-- Labels -->
  <text x="200" y="275" text-anchor="middle" font-size="12" fill="#16a34a" font-weight="500">✓ Annotations threaded to children</text>
  <text x="555" y="275" text-anchor="middle" font-size="12" fill="#dc2626" font-weight="500">✗ Annotations silently dropped</text>

  <!-- Fix indicator -->
  <rect x="160" y="300" width="400" height="56" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="360" y="322" text-anchor="middle" font-size="13" font-weight="500" fill="#1e40af">Fix: thread annotations + stepKey + attachment</text>
  <text x="360" y="340" text-anchor="middle" font-size="12" fill="#1e40af">Same prefix/offset pattern — resolve, attach, return</text>
</svg>
