<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#666"/>
    </marker>
  </defs>

  <text x="300" y="20" text-anchor="middle" font-size="14" font-weight="600" fill="#333">Without salience: first-come-first-served</text>

  <!-- Pool capacity bar -->
  <rect x="60" y="45" width="480" height="30" rx="4" fill="#f0f0f0" stroke="#ccc"/>
  <text x="300" y="37" text-anchor="middle" font-size="11" fill="#888">6 slots</text>

  <!-- Email fills all slots -->
  <rect x="62" y="47" width="78" height="26" rx="3" fill="#93c5fd"/>
  <rect x="142" y="47" width="78" height="26" rx="3" fill="#93c5fd"/>
  <rect x="222" y="47" width="78" height="26" rx="3" fill="#93c5fd"/>
  <rect x="302" y="47" width="78" height="26" rx="3" fill="#93c5fd"/>
  <rect x="382" y="47" width="78" height="26" rx="3" fill="#93c5fd"/>
  <rect x="462" y="47" width="76" height="26" rx="3" fill="#93c5fd"/>

  <text x="100" y="64" text-anchor="middle" font-size="10" fill="#1e40af">email</text>
  <text x="180" y="64" text-anchor="middle" font-size="10" fill="#1e40af">email</text>
  <text x="260" y="64" text-anchor="middle" font-size="10" fill="#1e40af">email</text>
  <text x="340" y="64" text-anchor="middle" font-size="10" fill="#1e40af">email</text>
  <text x="420" y="64" text-anchor="middle" font-size="10" fill="#1e40af">email</text>
  <text x="500" y="64" text-anchor="middle" font-size="10" fill="#1e40af">email</text>

  <!-- Voice call arrives -->
  <line x1="300" y1="95" x2="300" y2="115" stroke="#666" marker-end="url(#arrow1)"/>
  <text x="300" y="90" text-anchor="middle" font-size="12" fill="#dc2626" font-weight="600">Voice call arrives</text>

  <!-- Blocked state -->
  <rect x="60" y="120" width="480" height="30" rx="4" fill="#f0f0f0" stroke="#ccc"/>
  <rect x="62" y="122" width="78" height="26" rx="3" fill="#93c5fd"/>
  <rect x="142" y="122" width="78" height="26" rx="3" fill="#93c5fd"/>
  <rect x="222" y="122" width="78" height="26" rx="3" fill="#93c5fd"/>
  <rect x="302" y="122" width="78" height="26" rx="3" fill="#93c5fd"/>
  <rect x="382" y="122" width="78" height="26" rx="3" fill="#93c5fd"/>
  <rect x="462" y="122" width="76" height="26" rx="3" fill="#93c5fd"/>

  <text x="100" y="139" text-anchor="middle" font-size="10" fill="#1e40af">email</text>
  <text x="180" y="139" text-anchor="middle" font-size="10" fill="#1e40af">email</text>
  <text x="260" y="139" text-anchor="middle" font-size="10" fill="#1e40af">email</text>
  <text x="340" y="139" text-anchor="middle" font-size="10" fill="#1e40af">email</text>
  <text x="420" y="139" text-anchor="middle" font-size="10" fill="#1e40af">email</text>
  <text x="500" y="139" text-anchor="middle" font-size="10" fill="#1e40af">email</text>

  <!-- Voice waiting -->
  <rect x="180" y="160" width="240" height="28" rx="4" fill="#fecaca" stroke="#dc2626" stroke-dasharray="4,3"/>
  <text x="300" y="178" text-anchor="middle" font-size="11" fill="#dc2626">Voice blocked — waiting for email to finish</text>

  <!-- Result label -->
  <text x="300" y="220" text-anchor="middle" font-size="12" fill="#666">Customer on hold. Email batch completes in ~30s.</text>
  <text x="300" y="240" text-anchor="middle" font-size="12" font-weight="600" fill="#dc2626">Voice SLA violated.</text>
</svg>
