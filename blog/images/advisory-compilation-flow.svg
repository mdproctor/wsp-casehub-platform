<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, -apple-system, sans-serif">
  <style>
    .box { fill: #f8f9fa; stroke: #343a40; stroke-width: 1.5; rx: 6; }
    .box-accent { fill: #e7f5ff; stroke: #1971c2; stroke-width: 1.5; rx: 6; }
    .box-result { fill: #f3f0ff; stroke: #7048e8; stroke-width: 1.5; rx: 6; }
    .label { font-size: 13px; fill: #495057; font-weight: 500; }
    .title { font-size: 11px; fill: #868e96; font-weight: 400; }
    .code { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 11px; fill: #212529; }
    .arrow { stroke: #868e96; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    .arrow-accent { stroke: #1971c2; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead-accent); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#868e96" stroke-width="1.2"/>
    </marker>
    <marker id="arrowhead-accent" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#1971c2" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- YAML source -->
  <rect x="20" y="30" width="200" height="120" class="box"/>
  <text x="30" y="52" class="title">YAML playbook step</text>
  <text x="30" y="76" class="code">- advisory:</text>
  <text x="30" y="94" class="code">    severity: WARNING</text>
  <text x="30" y="112" class="code">    message: "threshold..."</text>
  <text x="30" y="130" class="code">    action: ESCALATE</text>

  <!-- Arrow 1 -->
  <path d="M220,90 L270,90" class="arrow"/>

  <!-- AdvisoryCompiler -->
  <rect x="270" y="45" width="180" height="90" class="box-accent"/>
  <text x="280" y="67" class="title">playbook-compiler</text>
  <text x="280" y="90" class="label">AdvisoryCompiler</text>
  <text x="280" y="110" class="code">validate → SetTask</text>

  <!-- Arrow 2 -->
  <path d="M450,90 L500,90" class="arrow-accent"/>

  <!-- SWF SetTask -->
  <rect x="500" y="20" width="200" height="140" class="box-result"/>
  <text x="510" y="42" class="title">SWF workflow task</text>
  <text x="510" y="66" class="code">TaskItem("advisory_0")</text>
  <text x="510" y="86" class="code">  SetTask</text>
  <text x="510" y="106" class="code">    severity: "WARNING"</text>
  <text x="510" y="126" class="code">    message: "threshold..."</text>
  <text x="510" y="146" class="code">    action: "ESCALATE"</text>

  <!-- Decorator flow -->
  <rect x="270" y="200" width="180" height="60" class="box"/>
  <text x="280" y="222" class="title">decorator stack</text>
  <text x="280" y="242" class="code">when: → SwitchTask guard</text>

  <!-- Arrow from decorator to compiler -->
  <path d="M360,200 L360,135" class="arrow"/>

  <!-- Protocol binding -->
  <rect x="500" y="220" width="200" height="80" class="box"/>
  <text x="510" y="242" class="title">protocol binding (downstream)</text>
  <text x="510" y="266" class="label">scans advisory_* tasks</text>
  <text x="510" y="284" class="code">→ DispatchAdvisory</text>

  <!-- Arrow from result to protocol -->
  <path d="M600,160 L600,220" class="arrow"/>
</svg>
