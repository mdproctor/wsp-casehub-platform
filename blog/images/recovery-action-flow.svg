<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
  </defs>

  <!-- Step fails -->
  <rect x="20" y="140" width="120" height="44" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="80" y="166" text-anchor="middle" fill="#991b1b" font-weight="600">Step Fails</text>

  <!-- Handler diagnoses -->
  <rect x="180" y="140" width="140" height="44" rx="6" fill="#f0f9ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="250" y="166" text-anchor="middle" fill="#1e40af" font-weight="600">Handler Diagnoses</text>

  <!-- Arrow: fails → handler -->
  <line x1="140" y1="162" x2="176" y2="162" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- RunPlaybook branch -->
  <rect x="400" y="30" width="140" height="44" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="470" y="56" text-anchor="middle" fill="#166534" font-weight="600">RunPlaybook</text>

  <rect x="590" y="30" width="110" height="44" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="645" y="49" text-anchor="middle" fill="#166534" font-size="11">Run setup</text>
  <text x="645" y="64" text-anchor="middle" fill="#166534" font-size="11">→ Retry step</text>

  <!-- PromptUser branch -->
  <rect x="400" y="140" width="140" height="44" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="470" y="166" text-anchor="middle" fill="#854d0e" font-weight="600">PromptUser</text>

  <rect x="590" y="140" width="110" height="44" rx="6" fill="#fefce8" stroke="#ca8a04" stroke-width="1"/>
  <text x="645" y="156" text-anchor="middle" fill="#854d0e" font-size="11">Prompt user</text>
  <text x="645" y="171" text-anchor="middle" fill="#854d0e" font-size="11">→ Merge vars</text>

  <!-- Unrecoverable branch -->
  <rect x="400" y="250" width="140" height="44" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="470" y="276" text-anchor="middle" fill="#991b1b" font-weight="600">Unrecoverable</text>

  <rect x="590" y="250" width="110" height="44" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="645" y="269" text-anchor="middle" fill="#991b1b" font-size="11">Enriched error</text>
  <text x="645" y="284" text-anchor="middle" fill="#991b1b" font-size="11">→ Terminal</text>

  <!-- Arrow: handler → RunPlaybook -->
  <line x1="320" y1="155" x2="396" y2="55" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Arrow: handler → PromptUser -->
  <line x1="320" y1="162" x2="396" y2="162" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Arrow: handler → Unrecoverable -->
  <line x1="320" y1="170" x2="396" y2="268" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Arrow: RunPlaybook → outcome -->
  <line x1="540" y1="52" x2="586" y2="52" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Arrow: PromptUser → outcome -->
  <line x1="540" y1="162" x2="586" y2="162" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Arrow: Unrecoverable → outcome -->
  <line x1="540" y1="272" x2="586" y2="272" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Labels on branches -->
  <text x="345" y="90" text-anchor="middle" fill="#64748b" font-size="11" font-style="italic">provider</text>
  <text x="345" y="152" text-anchor="middle" fill="#64748b" font-size="11" font-style="italic">manual</text>
  <text x="345" y="235" text-anchor="middle" fill="#64748b" font-size="11" font-style="italic">none</text>

  <!-- NEW label on PromptUser -->
  <rect x="406" y="126" width="32" height="16" rx="3" fill="#ca8a04"/>
  <text x="422" y="138" text-anchor="middle" fill="white" font-size="10" font-weight="700">NEW</text>
</svg>
