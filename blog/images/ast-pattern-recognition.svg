  <!-- Source code block -->
  <rect x="20" y="44" width="300" height="160" rx="6" fill="#1e293b"/>
  <text x="32" y="65" font-size="10" font-family="'JetBrains Mono', monospace" fill="#94a3b8">// ConnectorBankApi.balance()</text>
  <text x="32" y="82" font-size="10" font-family="'JetBrains Mono', monospace" fill="#f59e0b">BankPlatform p =</text>
  <text x="52" y="96" font-size="10" font-family="'JetBrains Mono', monospace" fill="#f59e0b">bankService.platform(platform);</text>
  <text x="32" y="116" font-size="10" font-family="'JetBrains Mono', monospace" fill="#a78bfa">requireCapability(p,</text>
  <text x="52" y="130" font-size="10" font-family="'JetBrains Mono', monospace" fill="#a78bfa">AccountInfo.class, "balance");</text>
  <text x="32" y="150" font-size="10" font-family="'JetBrains Mono', monospace" fill="#34d399">return p</text>
  <text x="52" y="164" font-size="10" font-family="'JetBrains Mono', monospace" fill="#34d399">.accountInfo(userId())</text>
  <text x="52" y="178" font-size="10" font-family="'JetBrains Mono', monospace" fill="#34d399">.balance(accountId);</text>

  <!-- Extracted data -->
  <rect x="360" y="44" width="300" height="160" rx="6" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="374" y="65" font-size="11" font-weight="600" fill="#1e293b">InferredCallChain</text>

  <circle cx="378" cy="86" r="4" fill="#f59e0b"/>
  <text x="390" y="90" font-size="10" fill="#475569">spiType = BankPlatform</text>
  <circle cx="378" cy="106" r="4" fill="#f59e0b"/>
  <text x="390" y="110" font-size="10" fill="#475569">routingParam = platform</text>
