  <text x="390" y="130" font-size="10" fill="#475569">capability = AccountInfo</text>
  <circle cx="378" cy="146" r="4" fill="#34d399"/>
  <text x="390" y="150" font-size="10" fill="#475569">accessor = accountInfo</text>
  <circle cx="378" cy="166" r="4" fill="#34d399"/>
  <text x="390" y="170" font-size="10" fill="#475569">targetMethod = balance</text>
  <circle cx="378" cy="186" r="4" fill="#34d399"/>
  <text x="390" y="190" font-size="10" fill="#475569">targetArgs = [accountId]</text>

