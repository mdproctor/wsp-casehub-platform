  <text x="120" y="274" font-size="10" font-family="'JetBrains Mono', monospace" fill="#475569">@Plugin("bank-balance")</text>
  <text x="120" y="290" font-size="10" font-family="'JetBrains Mono', monospace" fill="#475569">record BankBalancePlugin(</text>
  <text x="140" y="306" font-size="10" font-family="'JetBrains Mono', monospace" fill="#475569">@Required String accountId, @Optional String userId) {</text>
  <text x="140" y="322" font-size="10" font-family="'JetBrains Mono', monospace" fill="#16a34a">Result execute(BankPlatform spi) {</text>
  <text x="160" y="338" font-size="10" font-family="'JetBrains Mono', monospace" fill="#16a34a">return spi.accountInfo(userId).balance(accountId); }</text>

