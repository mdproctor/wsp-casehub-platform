<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, -apple-system, sans-serif">
  <style>
    .label { font-size: 11px; fill: #374151; }
    .level-label { font-size: 10px; fill: #6b7280; text-anchor: end; }
    .title { font-size: 14px; fill: #111827; font-weight: 600; }
    .subtitle { font-size: 11px; fill: #6b7280; }
    .bar-1 { fill: #93c5fd; }
    .bar-2 { fill: #60a5fa; }
    .bar-3 { fill: #3b82f6; }
    .bar-4 { fill: #2563eb; }
    .bar-5 { fill: #1d4ed8; }
    .count { font-size: 9px; fill: #fff; font-weight: 600; }
    .count-dark { font-size: 9px; fill: #374151; font-weight: 600; }
    .legend { font-size: 10px; fill: #374151; }
  </style>

  <text x="360" y="24" text-anchor="middle" class="title">Playbook Difficulty Distribution by Category</text>
  <text x="360" y="40" text-anchor="middle" class="subtitle">70 playbooks across 10 categories, levels 1–5</text>

  <!-- Legend -->
  <rect x="200" y="52" width="12" height="12" rx="2" class="bar-1"/>
  <text x="216" y="62" class="legend">L1</text>
  <rect x="246" y="52" width="12" height="12" rx="2" class="bar-2"/>
  <text x="262" y="62" class="legend">L2</text>
  <rect x="292" y="52" width="12" height="12" rx="2" class="bar-3"/>
  <text x="308" y="62" class="legend">L3</text>
  <rect x="338" y="52" width="12" height="12" rx="2" class="bar-4"/>
  <text x="354" y="62" class="legend">L4</text>
  <rect x="384" y="52" width="12" height="12" rx="2" class="bar-5"/>
  <text x="400" y="62" class="legend">L5</text>

  <!-- Y-axis labels (categories) -->
  <text x="155" y="96" text-anchor="end" class="label">flow-control</text>
  <text x="155" y="120" text-anchor="end" class="label">step-workflows</text>
  <text x="155" y="144" text-anchor="end" class="label">composition</text>
  <text x="155" y="168" text-anchor="end" class="label">concurrency</text>
  <text x="155" y="192" text-anchor="end" class="label">coordination</text>
  <text x="155" y="216" text-anchor="end" class="label">primitives</text>
  <text x="155" y="240" text-anchor="end" class="label">invoke-bindings</text>
  <text x="155" y="264" text-anchor="end" class="label">data-delivery</text>
  <text x="155" y="288" text-anchor="end" class="label">agent-patterns</text>
  <text x="155" y="312" text-anchor="end" class="label">simulation</text>

  <!-- flow-control: 2×L1, 6×L2, 3×L3 = 12 -->
  <rect x="160" y="84" width="80" height="18" rx="2" class="bar-1"/>
  <text x="200" y="97" text-anchor="middle" class="count">2</text>
  <rect x="240" y="84" width="240" height="18" rx="2" class="bar-2"/>
  <text x="360" y="97" text-anchor="middle" class="count">6</text>
  <rect x="480" y="84" width="120" height="18" rx="2" class="bar-3"/>
  <text x="540" y="97" text-anchor="middle" class="count">3</text>

  <!-- step-workflows: 1×L1, 2×L2, 6×L3, 2×L4 = 13 (adjusted: 1+2+6+2 not right, let me recount) -->
  <!-- block-sequential=1, if-else=2, match-cases=2, when-structural=2, parallel=3, race=3, foreach-structural=3, try-catch-finally=3, retry-structural=3, timeout-structural=3, barrier=4, quorum=4, select=3 -->
  <!-- L1=1, L2=2, L3=8, L4=2 -->
  <rect x="160" y="108" width="40" height="18" rx="2" class="bar-1"/>
  <text x="180" y="121" text-anchor="middle" class="count">1</text>
  <rect x="200" y="108" width="80" height="18" rx="2" class="bar-2"/>
  <text x="240" y="121" text-anchor="middle" class="count">2</text>
  <rect x="280" y="108" width="320" height="18" rx="2" class="bar-3"/>
  <text x="440" y="121" text-anchor="middle" class="count">8</text>
  <rect x="600" y="108" width="80" height="18" rx="2" class="bar-4"/>
  <text x="640" y="121" text-anchor="middle" class="count">2</text>

  <!-- composition: 5×L3, 2×L4, 2×L5 = 9 -->
  <rect x="160" y="132" width="200" height="18" rx="2" class="bar-3"/>
  <text x="260" y="145" text-anchor="middle" class="count">5</text>
  <rect x="360" y="132" width="80" height="18" rx="2" class="bar-4"/>
  <text x="400" y="145" text-anchor="middle" class="count">2</text>
  <rect x="440" y="132" width="80" height="18" rx="2" class="bar-5"/>
  <text x="480" y="145" text-anchor="middle" class="count">2</text>

  <!-- concurrency-patterns: 1×L3, 6×L4, 1×L5 = 8 -->
  <rect x="160" y="156" width="40" height="18" rx="2" class="bar-3"/>
  <text x="180" y="169" text-anchor="middle" class="count">1</text>
  <rect x="200" y="156" width="240" height="18" rx="2" class="bar-4"/>
  <text x="320" y="169" text-anchor="middle" class="count">6</text>
  <rect x="440" y="156" width="40" height="18" rx="2" class="bar-5"/>
  <text x="460" y="169" text-anchor="middle" class="count">1</text>

  <!-- coordination: 2×L3, 2×L4 = 4 -->
  <rect x="160" y="180" width="80" height="18" rx="2" class="bar-3"/>
  <text x="200" y="193" text-anchor="middle" class="count">2</text>
  <rect x="240" y="180" width="80" height="18" rx="2" class="bar-4"/>
  <text x="280" y="193" text-anchor="middle" class="count">2</text>

  <!-- coordination-primitives: 3×L2, 2×L3 = 6 (counter=2, flag=2, gauge=2, latch=3, accumulator=2, state-machine=3) -->
  <rect x="160" y="204" width="160" height="18" rx="2" class="bar-2"/>
  <text x="240" y="217" text-anchor="middle" class="count">4</text>
  <rect x="320" y="204" width="80" height="18" rx="2" class="bar-3"/>
  <text x="360" y="217" text-anchor="middle" class="count">2</text>

  <!-- invoke-bindings: 6×L3 = 6 -->
  <rect x="160" y="228" width="240" height="18" rx="2" class="bar-3"/>
  <text x="280" y="241" text-anchor="middle" class="count">6</text>

  <!-- data-delivery: 2×L3, 1×L4 = 3 -->
  <rect x="160" y="252" width="80" height="18" rx="2" class="bar-3"/>
  <text x="200" y="265" text-anchor="middle" class="count">2</text>
  <rect x="240" y="252" width="40" height="18" rx="2" class="bar-4"/>
  <text x="260" y="265" text-anchor="middle" class="count">1</text>

  <!-- agent-interaction-patterns: 1×L2, 4×L3, 3×L4 = 8 -->
  <rect x="160" y="276" width="40" height="18" rx="2" class="bar-2"/>
  <text x="180" y="289" text-anchor="middle" class="count">1</text>
  <rect x="200" y="276" width="160" height="18" rx="2" class="bar-3"/>
  <text x="280" y="289" text-anchor="middle" class="count">4</text>
  <rect x="360" y="276" width="120" height="18" rx="2" class="bar-4"/>
  <text x="420" y="289" text-anchor="middle" class="count">3</text>

  <!-- simulation: 1×L4 = 1 -->
  <rect x="160" y="300" width="40" height="18" rx="2" class="bar-4"/>
  <text x="180" y="313" text-anchor="middle" class="count">1</text>
</svg>
