<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Scope Registration: Variable Resolution vs Expression Evaluation</text>

  <!-- Source data -->
  <rect x="20" y="60" width="140" height="80" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="90" y="85" text-anchor="middle" font-size="13" font-weight="500" fill="#334155">Scope Data</text>
  <text x="90" y="105" text-anchor="middle" font-size="11" fill="#64748b">match, each,</text>
  <text x="90" y="120" text-anchor="middle" font-size="11" fill="#64748b">signal, error</text>

  <!-- Arrow to objectPrefixSources -->
  <line x1="160" y1="85" x2="220" y2="85" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- objectPrefixSources -->
  <rect x="225" y="52" width="200" height="72" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="325" y="77" text-anchor="middle" font-size="13" font-weight="500" fill="#334155">objectPrefixSources</text>
  <text x="325" y="97" text-anchor="middle" font-size="11" fill="#64748b">ObjectVariableSource</text>
  <text x="325" y="112" text-anchor="middle" font-size="11" fill="#64748b">(functional — drill support)</text>

  <!-- Arrow from objectPrefixSources to ${} resolution -->
  <line x1="425" y1="88" x2="500" y2="88" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ${} resolution -->
  <rect x="505" y="60" width="190" height="56" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="600" y="83" text-anchor="middle" font-size="13" font-weight="500" fill="#166534">${match.field}</text>
  <text x="600" y="100" text-anchor="middle" font-size="11" fill="#166534">✓ Always worked</text>

  <!-- NEW: Arrow from source to scopeContainers -->
  <line x1="90" y1="140" x2="90" y2="180" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="90" y1="180" x2="90" y2="200" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="105" y="178" font-size="10" fill="#16a34a" font-weight="500">NEW</text>

  <!-- Arrow to scopeContainers -->
  <line x1="160" y1="228" x2="220" y2="228" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- scopeContainers -->
  <rect x="225" y="195" width="200" height="72" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="325" y="220" text-anchor="middle" font-size="13" font-weight="500" fill="#1e40af">scopeContainers</text>
  <text x="325" y="240" text-anchor="middle" font-size="11" fill="#1e40af">Map&lt;String, Object&gt;</text>
  <text x="325" y="255" text-anchor="middle" font-size="11" fill="#1e40af">(concrete data)</text>

  <!-- Arrow from scopeContainers to expression eval -->
  <line x1="425" y1="231" x2="500" y2="231" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Expression eval -->
  <rect x="505" y="203" width="190" height="56" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="600" y="226" text-anchor="middle" font-size="13" font-weight="500" fill="#166534">MVEL / JQ eval</text>
  <text x="600" y="243" text-anchor="middle" font-size="11" fill="#166534">✓ Now works</text>

  <!-- Before label -->
  <rect x="505" y="270" width="190" height="36" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="600" y="293" text-anchor="middle" font-size="11" fill="#991b1b">Before: scope invisible to expressions</text>
</svg>
