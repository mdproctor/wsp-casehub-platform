<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#374151" stroke-width="1.2"/>
    </marker>
    <marker id="arrow-up" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <path d="M8,0 L0,3 L8,6" fill="none" stroke="#374151" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="340" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#111827">@AgentService Decorator Stack</text>

  <!-- Layers -->
  <rect x="40" y="44" width="600" height="48" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
  <text x="60" y="72" font-weight="600" fill="#92400E">Input Guardrail</text>
  <text x="380" y="72" fill="#78350F" font-size="12">@Priority(1400) — validate prompt, reject before gate</text>

  <rect x="60" y="104" width="560" height="48" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.2"/>
  <text x="80" y="132" font-weight="600" fill="#92400E">Output Guardrail</text>
  <text x="380" y="132" fill="#78350F" font-size="12">@Priority(1600) — buffer, validate, replay</text>

  <rect x="80" y="164" width="520" height="48" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.2"/>
  <text x="100" y="192" font-weight="600" fill="#1E40AF">Gate</text>
  <text x="380" y="192" fill="#1E3A5F" font-size="12">@Priority(2000) — rate limit, semaphore</text>

  <rect x="100" y="224" width="480" height="48" rx="6" fill="#E0E7FF" stroke="#4F46E5" stroke-width="1.2"/>
  <text x="120" y="252" font-weight="600" fill="#3730A3">Observability</text>
  <text x="380" y="252" fill="#312E81" font-size="12">@Priority(1900) — Micrometer counters + timers</text>

  <rect x="120" y="284" width="440" height="48" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.2"/>
  <text x="140" y="312" font-weight="600" fill="#065F46">Routing</text>
  <text x="380" y="312" fill="#064E3B" font-size="12">RoutingAgentProvider — alias to backend</text>

  <rect x="140" y="344" width="400" height="48" rx="6" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.2"/>
  <text x="160" y="372" font-weight="600" fill="#374151">Backend</text>
  <text x="380" y="372" fill="#4B5563" font-size="12">Claude / OpenAI / Gemini / Ollama SDK</text>

  <!-- Flow arrows -->
  <line x1="30" y1="68" x2="30" y2="368" stroke="#374151" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="18" y="220" fill="#6B7280" font-size="11" transform="rotate(-90, 18, 220)">request</text>

  <line x1="654" y1="368" x2="654" y2="68" stroke="#374151" stroke-width="1.2" marker-end="url(#arrow-up)"/>
  <text x="666" y="220" fill="#6B7280" font-size="11" transform="rotate(90, 666, 220)">response</text>

  <!-- Labels -->
  <text x="340" y="410" text-anchor="middle" font-size="11" fill="#9CA3AF">Lower @Priority number = outer decorator (fires first)</text>
</svg>
