<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" font-family="'Inter', 'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#3b82f6"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#d97706"/>
    </marker>
    <filter id="sh">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/>
    </filter>
  </defs>

  <text x="390" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Two paths to the same catch scope</text>

  <!-- Path A: Exception propagation -->
  <text x="30" y="60" font-size="12" font-weight="600" fill="#3b82f6">Path A: Exception propagation</text>

  <rect x="30" y="72" width="140" height="40" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2" filter="url(#sh)"/>
  <text x="100" y="96" text-anchor="middle" font-size="11" fill="#1e40af">Step throws</text>

  <line x1="170" y1="92" x2="210" y2="92" stroke="#3b82f6" stroke-width="1.2" marker-end="url(#arr-blue)"/>

  <rect x="210" y="72" width="170" height="40" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2" filter="url(#sh)"/>
  <text x="295" y="96" text-anchor="middle" font-size="11" fill="#1e40af">YamlErrorMapper.from()</text>

  <line x1="380" y1="92" x2="420" y2="92" stroke="#3b82f6" stroke-width="1.2" marker-end="url(#arr-blue)"/>

  <rect x="420" y="72" width="140" height="40" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.2" filter="url(#sh)"/>
  <text x="490" y="96" text-anchor="middle" font-size="11" fill="#1e40af">Rich YamlError</text>

  <line x1="560" y1="92" x2="600" y2="92" stroke="#3b82f6" stroke-width="1.2" marker-end="url(#arr-blue)"/>

  <rect x="600" y="72" width="150" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="675" y="90" text-anchor="middle" font-size="10" fill="#1e40af" font-weight="500">${error.type}</text>
  <text x="675" y="104" text-anchor="middle" font-size="10" fill="#1e40af" font-weight="500">${error.detail}</text>

  <!-- Path B: Handler catch -->
  <text x="30" y="160" font-size="12" font-weight="600" fill="#d97706">Path B: Handler catch (through retry decorator)</text>

  <rect x="30" y="172" width="140" height="40" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2" filter="url(#sh)"/>
  <text x="100" y="196" text-anchor="middle" font-size="11" fill="#92400e">Handler catches</text>

  <line x1="170" y1="192" x2="210" y2="192" stroke="#d97706" stroke-width="1.2" marker-end="url(#arr-amber)"/>

  <rect x="210" y="172" width="170" height="40" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2" filter="url(#sh)"/>
  <text x="295" y="188" text-anchor="middle" font-size="10" fill="#92400e">Result.failed(msg,</text>
  <text x="295" y="202" text-anchor="middle" font-size="10" fill="#92400e">category, detail)</text>

  <line x1="380" y1="192" x2="420" y2="192" stroke="#d97706" stroke-width="1.2" marker-end="url(#arr-amber)"/>

  <rect x="420" y="172" width="140" height="40" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2" filter="url(#sh)"/>
  <text x="490" y="188" text-anchor="middle" font-size="10" fill="#92400e">Retry decorator</text>
  <text x="490" y="202" text-anchor="middle" font-size="10" fill="#92400e">(detail survives)</text>

  <line x1="560" y1="192" x2="600" y2="192" stroke="#d97706" stroke-width="1.2" marker-end="url(#arr-amber)"/>

  <rect x="600" y="155" width="150" height="58" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2" filter="url(#sh)"/>
  <text x="675" y="176" text-anchor="middle" font-size="10" fill="#92400e">fromFailure()</text>
  <text x="675" y="192" text-anchor="middle" font-size="10" fill="#92400e">→ Categorized</text>
  <text x="675" y="206" text-anchor="middle" font-size="10" fill="#92400e">StepActionError</text>

  <!-- Convergence -->
  <line x1="675" y1="112" x2="675" y2="145" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="675" y1="213" x2="675" y2="250" stroke="#64748b" stroke-width="1" stroke-dasharray="4,3"/>

  <rect x="590" y="250" width="170" height="50" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" filter="url(#sh)"/>
  <text x="675" y="272" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">Catch scope</text>
  <text x="675" y="290" text-anchor="middle" font-size="10" fill="#166534">Same output either path</text>

  <!-- Why box -->
  <rect x="30" y="260" width="520" height="100" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" filter="url(#sh)"/>
  <text x="50" y="284" font-size="11" font-weight="600" fill="#475569">Why two paths?</text>
  <text x="50" y="304" font-size="11" fill="#64748b">The retry decorator catches exceptions and stores Result.Failure.</text>
  <text x="50" y="322" font-size="11" fill="#64748b">Typed exception info is lost when it crosses that boundary.</text>
  <text x="50" y="340" font-size="11" fill="#64748b">Handlers must catch and categorise before the decorator swallows the type.</text>
</svg>
