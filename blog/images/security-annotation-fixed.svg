<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="360" y="24" text-anchor="middle" font-weight="bold" fill="#1e293b" font-size="15">Security Annotation Flow: Source → Generated</text>

  <!-- Source SPI -->
  <rect x="20" y="45" width="220" height="160" rx="8" fill="#f0f9ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="130" y="68" text-anchor="middle" font-weight="bold" fill="#1e40af" font-size="12">@McpDomain SPI</text>

  <text x="35" y="92" fill="#059669" font-size="10" font-family="monospace">@Authenticated</text>
  <text x="35" y="108" fill="#059669" font-size="10" font-family="monospace">@RolesAllowed("admin")</text>
  <text x="35" y="124" fill="#059669" font-size="10" font-family="monospace">@PermitAll</text>
  <text x="35" y="148" fill="#64748b" font-size="10">↑ class-level: all three scanned</text>
  <text x="35" y="170" fill="#64748b" font-size="10">↑ method-level: each independently</text>
  <text x="35" y="192" fill="#64748b" font-size="10">↑ @NameBinding: passthrough</text>

  <!-- Arrow to Jandex -->
  <line x1="250" y1="100" x2="310" y2="75" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr)"/>
  <!-- Arrow to RoundEnv -->
  <line x1="250" y1="160" x2="310" y2="175" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Scanning paths -->
  <rect x="320" y="45" width="160" height="50" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="1"/>
  <text x="400" y="68" text-anchor="middle" font-weight="bold" fill="#854d0e" font-size="11">Jandex Path</text>
  <text x="400" y="84" text-anchor="middle" fill="#854d0e" font-size="9">Dependency JARs</text>

  <rect x="320" y="145" width="160" height="50" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="1"/>
  <text x="400" y="168" text-anchor="middle" font-weight="bold" fill="#854d0e" font-size="11">RoundEnv Path</text>
  <text x="400" y="184" text-anchor="middle" fill="#854d0e" font-size="9">Current compilation unit</text>

  <!-- Merge -->
  <line x1="490" y1="70" x2="530" y2="120" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="490" y1="170" x2="530" y2="120" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- DomainOperations -->
  <rect x="540" y="55" width="160" height="140" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="620" y="78" text-anchor="middle" font-weight="bold" fill="#6d28d9" font-size="11">DomainOperations</text>

  <text x="555" y="100" fill="#334155" font-size="9" font-family="monospace">classRolesAllowed</text>
  <text x="555" y="116" fill="#334155" font-size="9" font-family="monospace">classPermitAll</text>
  <text x="555" y="132" fill="#334155" font-size="9" font-family="monospace">classAuthenticated</text>
  <text x="555" y="148" fill="#334155" font-size="9" font-family="monospace">classPassedAnnotations</text>
  <text x="555" y="175" fill="#dc2626" font-size="9" font-family="monospace">⚠ conflict → clear + WARN</text>

  <!-- Arrow down to emission -->
  <line x1="620" y1="200" x2="620" y2="240" stroke="#64748b" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Emission targets -->
  <rect x="30" y="250" width="660" height="130" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="360" y="273" text-anchor="middle" font-weight="bold" fill="#166534" font-size="12">Emission — 4 REST Method Types</text>

  <rect x="45" y="285" width="145" height="40" rx="4" fill="white" stroke="#86efac"/>
  <text x="117" y="300" text-anchor="middle" fill="#334155" font-size="10" font-weight="bold">Regular</text>
  <text x="117" y="315" text-anchor="middle" fill="#334155" font-size="9">GET / POST</text>

  <rect x="200" y="285" width="145" height="40" rx="4" fill="white" stroke="#86efac"/>
  <text x="272" y="300" text-anchor="middle" fill="#334155" font-size="10" font-weight="bold">Stream</text>
  <text x="272" y="315" text-anchor="middle" fill="#334155" font-size="9">GET + SSE</text>

  <rect x="355" y="285" width="145" height="40" rx="4" fill="white" stroke="#86efac"/>
  <text x="427" y="300" text-anchor="middle" fill="#334155" font-size="10" font-weight="bold">Streaming Mutation</text>
  <text x="427" y="315" text-anchor="middle" fill="#334155" font-size="9">POST + SSE</text>

  <rect x="510" y="285" width="145" height="40" rx="4" fill="white" stroke="#86efac"/>
  <text x="582" y="300" text-anchor="middle" fill="#334155" font-size="10" font-weight="bold">Webhook</text>
  <text x="582" y="315" text-anchor="middle" fill="#334155" font-size="9">POST + custom</text>

  <text x="360" y="365" text-anchor="middle" fill="#059669" font-size="11">All four now emit class-level + method-level security annotations</text>
</svg>
