<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="'Inter', 'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#64748b"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#dc2626"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#059669"/>
    </marker>
  </defs>

  <style>
    .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 6; }
    .box-active { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 6; }
    .box-error { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.5; rx: 6; }
    .box-suggest { fill: #f0fdf4; stroke: #059669; stroke-width: 1.5; rx: 6; }
    .label { font-size: 13px; fill: #1e293b; font-weight: 600; }
    .sublabel { font-size: 11px; fill: #64748b; }
    .code { font-size: 11px; fill: #475569; font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .title { font-size: 16px; fill: #0f172a; font-weight: 700; }
    .phase { font-size: 10px; fill: #94a3b8; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
  </style>

  <!-- Title -->
  <text x="380" y="28" text-anchor="middle" class="title">Validation Pipeline — Error Collection Mode</text>

  <!-- Phase labels -->
  <text x="100" y="58" text-anchor="middle" class="phase">Parse</text>
  <text x="300" y="58" text-anchor="middle" class="phase">Resolve</text>
  <text x="520" y="58" text-anchor="middle" class="phase">Diagnose</text>
  <text x="680" y="58" text-anchor="middle" class="phase">Suggest</text>

  <!-- YAML Input -->
  <rect x="30" y="70" width="140" height="60" class="box"/>
  <text x="100" y="93" text-anchor="middle" class="label">Playbook YAML</text>
  <text x="100" y="110" text-anchor="middle" class="code">- log: hello</text>
  <text x="100" y="122" text-anchor="middle" class="code">- lg: world</text>

  <!-- Arrow to Walker -->
  <line x1="170" y1="100" x2="210" y2="100" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Walker box -->
  <rect x="215" y="70" width="170" height="60" class="box-active"/>
  <text x="300" y="93" text-anchor="middle" class="label">Walker.resolve()</text>
  <text x="300" y="110" text-anchor="middle" class="sublabel">+ YamlErrorCollector</text>
  <text x="300" y="122" text-anchor="middle" class="sublabel">accumulates, doesn't throw</text>

  <!-- Two output paths from Walker -->

  <!-- Valid step path -->
  <line x1="385" y1="88" x2="430" y2="88" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <rect x="435" y="70" width="140" height="38" class="box"/>
  <text x="505" y="85" text-anchor="middle" class="label">PluginStep</text>
  <text x="505" y="98" text-anchor="middle" class="code">log: hello ✓</text>

  <!-- Error step path -->
  <line x1="385" y1="112" x2="430" y2="112" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <rect x="435" y="114" width="140" height="38" class="box-error"/>
  <text x="505" y="129" text-anchor="middle" class="label">ErrorStep</text>
  <text x="505" y="142" text-anchor="middle" class="code">lg: world ✗</text>

  <!-- Arrow from ErrorStep to Diagnostics -->
  <line x1="505" y1="152" x2="505" y2="175" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <!-- Diagnostics box -->
  <rect x="415" y="180" width="210" height="68" class="box-error"/>
  <text x="520" y="200" text-anchor="middle" class="label">ParseError.UnknownStepError</text>
  <text x="520" y="216" text-anchor="middle" class="code">action: "lg"</text>
  <text x="520" y="232" text-anchor="middle" class="code">file: "playbook.yaml"</text>
  <text x="520" y="244" text-anchor="middle" class="sublabel">typed, structured, machine-readable</text>

  <!-- Arrow from Diagnostics to Suggestions -->
  <line x1="625" y1="214" x2="630" y2="214" stroke="#059669" stroke-width="1.5"/>
  <line x1="630" y1="214" x2="630" y2="275" stroke="#059669" stroke-width="1.5"/>
  <line x1="630" y1="275" x2="635" y2="275" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Suggestion box -->
  <rect x="640" y="250" width="110" height="68" class="box-suggest"/>
  <text x="695" y="270" text-anchor="middle" class="label">Suggestion</text>
  <text x="695" y="286" text-anchor="middle" class="code">"log" (d=1)</text>
  <text x="695" y="302" text-anchor="middle" class="sublabel">Levenshtein</text>
  <text x="695" y="314" text-anchor="middle" class="sublabel">closest match</text>

  <!-- Result box at the bottom -->
  <rect x="80" y="260" width="440" height="60" class="box-active"/>
  <text x="300" y="282" text-anchor="middle" class="label">PlaybookValidationResult</text>
  <text x="300" y="298" text-anchor="middle" class="code">valid: false | diagnostics: [UnknownStepError] | suggestions: ["log"]</text>
  <text x="300" y="312" text-anchor="middle" class="sublabel">LLM reads structured diagnostics → corrects on next attempt</text>

  <!-- Arrow from suggestion to result -->
  <line x1="640" y1="310" x2="525" y2="310" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- Arrow from diagnostics down to result -->
  <line x1="460" y1="248" x2="300" y2="270" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,3"/>
</svg>
