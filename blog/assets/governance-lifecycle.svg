<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" font-family="Inter, -apple-system, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="9" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="720" height="200" fill="#0f172a" rx="8"/>

  <!-- Confirmation box -->
  <rect x="30" y="55" width="160" height="90" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="110" y="85" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="600">Confirmation</text>
  <text x="110" y="105" text-anchor="middle" fill="#94a3b8" font-size="11">pre-execution</text>
  <text x="110" y="122" text-anchor="middle" fill="#64748b" font-size="10">"Should this proceed?"</text>

  <!-- Execution Policy box -->
  <rect x="240" y="55" width="160" height="90" rx="6" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
  <text x="320" y="85" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="600">Execution Policy</text>
  <text x="320" y="105" text-anchor="middle" fill="#94a3b8" font-size="11">during execution</text>
  <text x="320" y="122" text-anchor="middle" fill="#64748b" font-size="10">retry · timeout · breaker</text>

  <!-- Triage box (highlighted) -->
  <rect x="450" y="55" width="160" height="90" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="530" y="85" text-anchor="middle" fill="#fcd34d" font-size="13" font-weight="600">Triage</text>
  <text x="530" y="105" text-anchor="middle" fill="#94a3b8" font-size="11">post-failure</text>
  <text x="530" y="122" text-anchor="middle" fill="#64748b" font-size="10">"This failed, what now?"</text>

  <!-- NEW badge -->
  <rect x="583" y="48" width="36" height="18" rx="9" fill="#f59e0b"/>
  <text x="601" y="61" text-anchor="middle" fill="#0f172a" font-size="9" font-weight="700">NEW</text>

  <!-- Arrows -->
  <line x1="190" y1="100" x2="237" y2="100" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="100" x2="447" y2="100" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Timeline labels -->
  <text x="110" y="170" text-anchor="middle" fill="#475569" font-size="10">BEFORE</text>
  <text x="320" y="170" text-anchor="middle" fill="#475569" font-size="10">DURING</text>
  <text x="530" y="170" text-anchor="middle" fill="#475569" font-size="10">AFTER</text>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="600">Platform Governance Lifecycle</text>
</svg>
