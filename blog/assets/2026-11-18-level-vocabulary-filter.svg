<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="'Inter', 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="levelGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="720" height="340" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-size="13" font-weight="600" fill="#374151">Step catalogue at each level — what the LLM sees</text>

  <!-- Level bars -->
  <!-- Foundational -->
  <rect x="40" y="50" width="100" height="44" rx="4" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-opacity="0.3" stroke-width="1"/>
  <text x="90" y="68" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">foundational</text>
  <text x="90" y="84" text-anchor="middle" font-size="9" fill="#6b7280">log, assert, fail</text>

  <!-- Basic patterns -->
  <rect x="40" y="106" width="210" height="44" rx="4" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-opacity="0.3" stroke-width="1"/>
  <text x="145" y="124" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">basic-patterns</text>
  <text x="145" y="140" text-anchor="middle" font-size="9" fill="#6b7280">+ if/else, match, retry, timeout, for-each</text>

  <!-- Intermediate -->
  <rect x="40" y="162" width="370" height="44" rx="4" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-opacity="0.3" stroke-width="1"/>
  <text x="225" y="180" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">intermediate</text>
  <text x="225" y="196" text-anchor="middle" font-size="9" fill="#6b7280">+ parallel, race, concurrent, modules, channels, signals</text>

  <!-- Advanced -->
  <rect x="40" y="218" width="510" height="44" rx="4" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-opacity="0.3" stroke-width="1"/>
  <text x="295" y="236" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">advanced</text>
  <text x="295" y="252" text-anchor="middle" font-size="9" fill="#6b7280">+ orchestration, correlation, state machines, barriers, semaphores</text>

  <!-- Expert -->
  <rect x="40" y="274" width="640" height="44" rx="4" fill="#2563eb" fill-opacity="0.12" stroke="#2563eb" stroke-opacity="0.3" stroke-width="1"/>
  <text x="360" y="292" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">expert</text>
  <text x="360" y="308" text-anchor="middle" font-size="9" fill="#6b7280">+ mcp-call, graphql-exec, codegen — full platform vocabulary</text>

  <!-- Excluded zone -->
  <rect x="682" y="274" width="30" height="44" rx="4" fill="#ef4444" fill-opacity="0.08" stroke="#ef4444" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="697" y="300" text-anchor="middle" font-size="7" fill="#dc2626" transform="rotate(-90, 697, 300)">risk</text>
</svg>
