<svg viewBox="0 0 700 280" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: system-ui, sans-serif; font-size: 12px; fill: #333; }
    .label { font-weight: bold; font-size: 13px; }
    .small { font-size: 10px; fill: #666; }
    .box { fill: #e3f2fd; stroke: #1565c0; stroke-width: 1.5; rx: 6; }
    .decision { fill: #fff8e1; stroke: #f57f17; stroke-width: 1.5; rx: 6; }
    .action { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 1.5; rx: 6; }
    .arrow { stroke: #555; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    .feedback { stroke: #d32f2f; stroke-width: 1.5; fill: none; stroke-dasharray: 5,3; marker-end: url(#arrowred); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#555"/></marker>
    <marker id="arrowred" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#d32f2f"/></marker>
  </defs>

  <rect class="box" x="20" y="20" width="150" height="50"/>
  <text class="label" x="95" y="42" text-anchor="middle">Sweep (60s)</text>
  <text class="small" x="95" y="56" text-anchor="middle">getOverloaded(0.7)</text>

  <path class="arrow" d="M170,45 L230,45"/>

  <rect class="box" x="230" y="20" width="150" height="50"/>
  <text class="label" x="305" y="42" text-anchor="middle">CDI Event</text>
  <text class="small" x="305" y="56" text-anchor="middle">per overloaded actor</text>

  <path class="arrow" d="M380,45 L440,45"/>

  <rect class="decision" x="440" y="20" width="160" height="50"/>
  <text class="label" x="520" y="42" text-anchor="middle">Policy</text>
  <text class="small" x="520" y="56" text-anchor="middle">evaluate(context)</text>

  <path class="arrow" d="M520,70 L520,100"/>

  <rect class="action" x="30" y="100" width="130" height="45"/>
  <text class="label" x="95" y="118" text-anchor="middle">Hold</text>
  <text class="small" x="95" y="133" text-anchor="middle">below threshold</text>

  <rect class="action" x="180" y="100" width="130" height="45"/>
  <text class="label" x="245" y="118" text-anchor="middle">Compress</text>
  <text class="small" x="245" y="133" text-anchor="middle">0.7 – 0.85</text>

  <rect class="action" x="330" y="100" width="150" height="45"/>
  <text class="label" x="405" y="118" text-anchor="middle">Redistribute</text>
  <text class="small" x="405" y="133" text-anchor="middle">≥ 0.85, HANDOFF</text>

  <rect class="action" x="500" y="100" width="130" height="45"/>
  <text class="label" x="565" y="118" text-anchor="middle">Escalate</text>
  <text class="small" x="565" y="133" text-anchor="middle">stuck or inactive</text>

  <path class="arrow" d="M440,120 L480,120"/>
  <path class="arrow" d="M330,120 L310,120"/>
  <path class="arrow" d="M180,120 L160,120"/>

  <path class="feedback" d="M405,145 Q405,200 95,200 Q40,200 40,100 L40,70"/>
  <text class="small" x="200" y="210" text-anchor="middle" fill="#d32f2f">pressure drops → next sweep sees lower value</text>

  <text class="small" x="350" y="260" text-anchor="middle">each HANDOFF reduces obligation count by 1</text>
  <text class="small" x="350" y="275" text-anchor="middle">finite obligations → finite iterations → converges</text>
</svg>
