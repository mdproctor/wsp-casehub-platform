<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .state { font-size: 14px; font-weight: 600; fill: #333; }
    .label { font-size: 11px; fill: #666; }
    .box { rx: 8; ry: 8; stroke-width: 2; }
  </style>

  <!-- ACTIVE -->
  <rect x="40" y="60" width="140" height="60" class="box" fill="#d4edda" stroke="#28a745"/>
  <text x="110" y="95" text-anchor="middle" class="state">ACTIVE</text>

  <!-- GRACE_PERIOD -->
  <rect x="280" y="60" width="160" height="60" class="box" fill="#fff3cd" stroke="#ffc107"/>
  <text x="360" y="95" text-anchor="middle" class="state">GRACE_PERIOD</text>

  <!-- REVOKED -->
  <rect x="540" y="60" width="140" height="60" class="box" fill="#f8d7da" stroke="#dc3545"/>
  <text x="610" y="95" text-anchor="middle" class="state">REVOKED</text>

  <!-- store() arrow into ACTIVE -->
  <text x="110" y="45" text-anchor="middle" class="label">store()</text>
  <line x1="110" y1="48" x2="110" y2="58" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- rotate() arrow ACTIVE → GRACE_PERIOD -->
  <line x1="182" y1="85" x2="278" y2="85" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="230" y="78" text-anchor="middle" class="label">rotate()</text>

  <!-- rotate() again or revoke() arrow GRACE_PERIOD → REVOKED -->
  <line x1="442" y1="85" x2="538" y2="85" stroke="#555" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="490" y="78" text-anchor="middle" class="label">rotate() / revoke()</text>

  <!-- revoke() arrow ACTIVE → REVOKED (curved) -->
  <path d="M 180 120 Q 400 190 540 120" fill="none" stroke="#dc3545" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowhead)"/>
  <text x="360" y="175" text-anchor="middle" class="label" fill="#dc3545">revoke()</text>

  <!-- expiresAt annotation -->
  <text x="360" y="140" text-anchor="middle" class="label" font-style="italic">expiresAt = now + TTL</text>

  <!-- Terminal annotation -->
  <text x="610" y="140" text-anchor="middle" class="label" font-style="italic">terminal (audit trail)</text>
</svg>
